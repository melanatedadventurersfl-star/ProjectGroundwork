data-publish="'+t.id+'">Publish</button>':'')+(t.status==='published'?'<button class="btn" data-hold="'+t.id+'">Safety hold</button>':'')+'</div>')).join('')||'<div class="empty">No tasks yet.</div>');document.querySelector('#newtask').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await query(async()=>{const payload={title:f.get('title'),description:f.get('description'),zone_id:f.get('zone_id')||null,priority:f.get('priority'),estimated_minutes:Number(f.get('estimated_minutes')),pay_cents:Math.round(Number(f.get('pay'))*100),crew_size:Number(f.get('crew_size')),required_skill:f.get('required_skill'),material_status:f.get('material_status'),status:f.get('status'),requires_video:f.has('requires_video'),created_by:user.id};const {error}=await sb.from('sg_tasks').insert(payload);if(error)throw error;});};document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=()=>query(async()=>{const {error}=await sb.from('sg_tasks').update({status:'published'}).eq('id',b.dataset.publish);if(error)throw error;}));document.querySelectorAll('[data-hold]').forEach(b=>b.onclick=()=>query(async()=>{const {error}=await sb.from('sg_tasks').update({status:'safety_hold'}).eq('id',b.dataset.hold);if(error)throw error;}));}
function reviewAssignment(id){const a=assignments.find(a=>a.id===id),t=taskBy(a.task_id),files=evidence.filter(e=>e.assignment_id===id);tab='operations';render();document.querySelector('#view').innerHTML='<button class="btn" id="back">← Operations</button>'+card('<h2>Review: '+esc(t?.title||'Task')+'</h2><p>Worker: '+esc(team.find(m=>m.user_id===a.worker_id)?.display_name||short(a.worker_id))+'</p><p>Submitted: '+when(a.submitted_at)+'</p><p>Offered pay: '+money(a.pay_cents)+'</p><p>Worker notes: '+esc(a.notes||'None')+'</p><h3>Evidence</h3><div id="evidencelist">'+(files.map(x=>'<p>'+esc(x.phase)+' · <button class="btn" data-file="'+esc(x.storage_path)+'">View signed file</button></p>').join('')||'No files')+'</div><div class="actions"><button class="btn primary" id="approve">Verify completed</button><button class="btn" id="correction">Request correction</button></div>');document.querySelector('#back').onclick=render;document.querySelectorAll('[data-file]').forEach(b=>b.onclick=async()=>{const {data,error}=await sb.storage.from('sg-evidence').createSignedUrl(b.dataset.file,120);if(error)return msg(error.message);window.open(data.signedUrl,'_blank','noopener');});document.querySelector('#approve').onclick=()=>decide('approved');document.querySelector('#correction').onclick=()=>decide('correction');async function decide(decision){const note=prompt('Review note (optional):')||'';await query(async()=>{let r=await sb.from('sg_reviews').insert({assignment_id:id,reviewer_id:user.id,decision,note});if(r.error)throw r.error;if(decision==='approved'){r=await sb.from('sg_assignments').update({status:'verified'}).eq('id',id);if(r.error)throw r.error;r=await sb.from('sg_payments').upsert({assignment_id:id,amount_cents:a.pay_cents,updated_by:user.id,status:'pending'},{onConflict:'assignment_id'});if(r.error)throw r.error;}else{r=await sb.from('sg_assignments').update({status:'paused',notes:'Correction requested: '+note}).eq('id',id);if(r.error)throw r.error;}})}}
function workersView(el){el.innerHTML='<h1 class="title">Workers</h1>'+(team.map(m=>card('<div class="row"><div><h3>'+esc(m.display_name||short(m.user_id))+'</h3><p class="muted">'+esc(m.role)+' · '+esc(m.approval)+'</p></div>'+(m.approval==='pending'?'<button class="btn primary" data-approve="'+m.user_id+'">Approve</button>':'')+'</div><p class="muted">Claimed skills: '+esc(m.skills?.join(', ')||'None')+'</p><p class="muted">Verified: '+esc(m.verified_skills?.join(', ')||'None')+'</p><div class="actions"><button class="btn" data-skills="'+m.user_id+'">Edit verified skills</button></div>')).join('')||'<div class="empty">No registered workers yet.</div>');document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>query(async()=>{const {error}=await sb.from('sg_members').update({approval:'approved'}).eq('user_id',b.dataset.approve);if(error)throw error;}));document.querySelectorAll('[data-skills]').forEach(b=>b.onclick=async()=>{const m=team.find(x=>x.user_id===b.dataset.skills),s=prompt('Verified skills (comma separated)',m?.verified_skills?.join(', ')||'');if(s===null)return;await query(async()=>{const {error}=await sb.from('sg_members').update({verified_skills:s.split(',').map(x=>x.trim()).filter(Boolean)}).eq('user_id',m.user_id);if(error)throw error;});});}
function managerPayments(el){el.innerHTML='<h1 class="title">Payment Ledger</h1><p class="muted">External transfers only. This does not send money or verify bank settlement.</p>'+(payments.map(p=>{const a=assignments.find(a=>a.id===p.assignment_id);return card('<div class="row"><div><h3>'+esc(taskBy(a?.task_id)?.title||'Task')+'</h3><p class="muted">'+esc(team.find(m=>m.user_id===a?.worker_id)?.display_name||'Worker')+'</p></div><strong>'+money(p.amount_cents)+'</strong></div><p>'+badge(p.status)+'</p><div class="actions">'+(p.status==='pending'?'<button class="btn" data-pay="'+p.id+'" data-state="authorized">Authorize</button>':'')+(p.status==='authorized'?'<button class="btn primary" data-pay="'+p.id+'" data-state="sent">Mark sent</button>':'')+(p.status==='sent'?'<button class="btn" data-pay="'+p.id+'" data-state="confirmed">Confirm receipt</button>':'')+'</div>')}).join('')||'<div class="empty">No verified task payments yet.</div>');document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>query(async()=>{const ref=b.dataset.state==='sent'?prompt('External transfer reference (required):'):null;if(b.dataset.state==='sent'&&!ref)throw Error('Reference required');const payload={status:b.dataset.state,updated_at:new Date().toISOString(),updated_by:user.id};if(ref)payload.transfer_reference=ref;const {error}=await sb.from('sg_payments').update(payload).eq('id',b.dataset.pay);if(error)throw error;}));}
function propertyView(el){el.innerHTML='<h1 class="title">Spring Glen Property</h1>'+card('<h3>Property zones</h3><p class="muted">Add building, unit and outdoor locations now. Uploading an actual property site plan and clickable map pins is planned for the next iteration.</p><div class="mapplaceholder">▧ &nbsp; Property map pending site plan</div><form id="zoneform" style="margin-top:18px"><label>New zone or unit name<input name="name" placeholder="Unit 3 · Front Entrance" required></label><button class="btn primary">Add zone</button></form>')+'<div class="grid two">'+zones.map(z=>card('<h3>'+esc(z.name)+'</h3><p class="muted">'+tasks.filter(t=>t.zone_id===z.id).length+' tasks</p>')).join('')+'</div>';document.querySelector('#zoneform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);query(async()=>{const {error}=await sb.from('sg_zones').insert({name:f.get('name')});if(error)throw error;});};}
function bindAuth(){document.querySelector('#authform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),mode=e.submitter?.value||'login';try{const r=mode==='signup'?await sb.auth.signUp({email:f.get('email'),password:f.get('password')}):await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(r.error)throw r.error;if(mode==='signup'&&!r.data.session){msg('Registration submitted. Please confirm your email using the link sent to you, then sign in.');return;}await load();}catch(err){msg(err.message);}};}
sb.auth.onAuthStateChange(()=>{setTimeout(load,0)});load();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
