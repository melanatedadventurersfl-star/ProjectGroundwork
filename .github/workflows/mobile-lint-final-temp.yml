name: Mobile lint final temp

on:
  push:
    branches:
      - chore/mobile-lint-optimization

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/mobile-lint-optimization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Remove final unused variable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('apps/mobile/app/groups/[id].tsx')
          text = p.read_text()
          next_text, count = re.subn(r'^\s*const official = .*?;\n', '', text, count=1, flags=re.M)
          if count != 1:
              raise SystemExit('Expected unused official variable was not found')
          p.write_text(next_text)
          PY
      - name: Verify zero lint warnings and typecheck
        run: |
          output="$(npm run mobile:lint 2>&1)"
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -Eq 'warning|problem'; then
            echo "Lint output still contains warnings/problems."
            exit 1
          fi
          npm run mobile:typecheck
      - name: Commit cleanup and remove temporary workflow
        run: |
          rm .github/workflows/mobile-lint-final-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile .github/workflows/mobile-lint-final-temp.yml
          git commit -m "Clear final mobile lint warning"
          git push origin HEAD:chore/mobile-lint-optimization
