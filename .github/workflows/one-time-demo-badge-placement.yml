name: One-time demo badge placement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-demo-badge-placement.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Put demo marker in badge instead of title
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("apps/mobile/app/(tabs)/index.tsx")
          text = p.read_text()
          old = "{item.is_featured ? <Text style={styles.compactEyebrow}>FEATURED</Text> : null}"
          new = "{item.is_demo ? <Text style={styles.compactEyebrow}>DEMO</Text> : item.is_featured ? <Text style={styles.compactEyebrow}>FEATURED</Text> : null}"
          if old not in text:
              raise SystemExit('Featured badge snippet not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Verify mobile TypeScript
        run: npm run mobile:typecheck

      - name: Commit badge placement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-demo-badge-placement.yml
          git add apps/mobile/app/'(tabs)'/index.tsx
          git commit -m "fix: show demo status in adventure badge"
          git push origin HEAD:main

# trigger
