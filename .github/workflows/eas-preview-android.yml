name: EAS Android Preview

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/app.json'
      - 'apps/mobile/app.config.js'
      - 'apps/mobile/app.config.ts'
      - 'apps/mobile/eas.json'
      - 'apps/mobile/package.json'
      - 'package-lock.json'
      - 'apps/mobile/android/**'
      - 'apps/mobile/ios/**'
      - 'apps/mobile/plugins/**'
      - 'apps/mobile/assets/ma-app-icon.png'
      - 'apps/mobile/assets/ma-splash-icon.png'
      - 'apps/mobile/assets/ma-pathfinder-mark.png'
  workflow_dispatch:

# APK builds are reserved for native/runtime changes. Once one starts, later
# native builds queue instead of cancelling it.
concurrency:
  group: eas-preview-android-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out native delivery commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify build target
        run: |
          CHECKED_OUT="$(git rev-parse HEAD)"
          echo "event_sha=${GITHUB_SHA}"
          echo "checked_out=${CHECKED_OUT}"
          test "${CHECKED_OUT}" = "${GITHUB_SHA}" || {
            echo "Checked-out commit does not match the native delivery SHA."
            exit 1
          }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Repair recoverable bundled raster assets before EAS upload
        run: |
          python3 -m pip install --quiet pillow
          python3 apps/mobile/scripts/prepare_image_assets.py

      - name: Strictly verify native PNGs before EAS upload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          for path in [
              Path('apps/mobile/assets/ma-app-icon.png'),
              Path('apps/mobile/assets/ma-splash-icon.png'),
              Path('apps/mobile/assets/ma-pathfinder-mark.png'),
          ]:
              with Image.open(path) as image:
                  if image.format != 'PNG':
                      raise RuntimeError(f'{path} is not a PNG.')
                  image.verify()
              with Image.open(path) as image:
                  image.load()
                  print(f'Valid native PNG: {path} ({image.width}x{image.height})')
          PY

      - name: Validate every bundled raster image before EAS upload
        run: python3 apps/mobile/scripts/validate_image_assets.py

      - name: Production bundle smoke test before EAS
        run: npm run mobile:bundlecheck
        env:
          EXPO_PUBLIC_APP_ENV: preview
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
          EXPO_PUBLIC_BUILD_PROFILE: preview
          EXPO_PUBLIC_BUILD_SOURCE: github-actions

      - name: Stamp preview APK with triggering commit and CI run
        working-directory: apps/mobile
        run: |
          BUILD_GIT_SHA="$(git rev-parse HEAD)"
          BUILD_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export BUILD_GIT_SHA BUILD_TIMESTAMP
          node <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          eas.build.preview.env = {
            ...(eas.build.preview.env || {}),
            EXPO_PUBLIC_GIT_SHA: process.env.BUILD_GIT_SHA,
            EXPO_PUBLIC_BUILD_NUMBER: process.env.GITHUB_RUN_NUMBER || 'unknown',
            EXPO_PUBLIC_BUILD_TIMESTAMP: process.env.BUILD_TIMESTAMP,
            EXPO_PUBLIC_BUILD_PROFILE: 'preview',
            EXPO_PUBLIC_BUILD_SOURCE: 'github-actions'
          };
          fs.writeFileSync('eas.json', `${JSON.stringify(eas, null, 2)}\n`);
          console.log(`Stamped preview build ${process.env.GITHUB_RUN_NUMBER || 'unknown'} with ${process.env.BUILD_GIT_SHA}`);
          NODE

      - name: Verify Expo authentication
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "EXPO_TOKEN repository secret is required."
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EAS project link
        working-directory: apps/mobile
        run: |
          node -e "const app=require('./app.json'); if (!app.expo?.extra?.eas?.projectId) { console.error('Missing expo.extra.eas.projectId.'); process.exit(1); }"

      - name: Build installable Android preview
        working-directory: apps/mobile
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --clear-cache
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
