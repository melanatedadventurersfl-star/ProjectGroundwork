name: EAS Android Preview

on:
  push:
    branches:
      - main
    paths:
      # Only changes that can affect the installed/native app should
      # automatically consume an EAS Android build.
      - 'apps/mobile/app.json'
      - 'apps/mobile/eas.json'
      - 'apps/mobile/package.json'
      - 'package-lock.json'
      - 'apps/mobile/android/**'
      - 'apps/mobile/ios/**'
      - 'apps/mobile/plugins/**'
      - 'apps/mobile/assets/ma-app-icon.png'
      - 'apps/mobile/assets/ma-splash-icon.png'
      - 'apps/mobile/assets/ma-pathfinder-mark.png'
      # A workflow repair should be able to produce a fresh APK immediately.
      - '.github/workflows/eas-preview-android.yml'
  workflow_dispatch:

concurrency:
  group: eas-preview-android-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify build is using current main
        run: |
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          CHECKED_OUT="$(git rev-parse HEAD)"
          if [ "${CHECKED_OUT}" != "${CURRENT_MAIN}" ]; then
            echo "Checked out ${CHECKED_OUT}, but current main is ${CURRENT_MAIN}."
            exit 1
          fi
          echo "APK candidate is current main: ${CURRENT_MAIN}"

      - name: Debounce rapid main updates before expensive build
        run: sleep 25

      - name: Re-check newest main before setup
        run: |
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          CHECKED_OUT="$(git rev-parse HEAD)"
          if [ "${CHECKED_OUT}" != "${CURRENT_MAIN}" ]; then
            echo "Refusing stale APK build. Checked out ${CHECKED_OUT}, latest main is ${CURRENT_MAIN}."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Canonicalize native Android PNG assets
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          # Temporary compatibility for any legacy truncated PNG already in
          # history. Mobile CI repairs and recommits these files on main.
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          paths = [
              Path('apps/mobile/assets/ma-app-icon.png'),
              Path('apps/mobile/assets/ma-splash-icon.png'),
              Path('apps/mobile/assets/ma-pathfinder-mark.png'),
          ]

          for path in paths:
              temp = path.with_name(path.stem + '.canonical.png')
              with Image.open(path) as image:
                  image.load()
                  image.convert('RGBA').save(
                      temp,
                      format='PNG',
                      optimize=False,
                      compress_level=6,
                  )
              temp.replace(path)
              print(f'Canonicalized {path}')
          PY

      - name: Strictly verify PNGs before EAS upload
        run: |
          python3 - <<'PY'
          from PIL import Image

          for path in [
              'apps/mobile/assets/ma-app-icon.png',
              'apps/mobile/assets/ma-splash-icon.png',
              'apps/mobile/assets/ma-pathfinder-mark.png',
          ]:
              with Image.open(path) as image:
                  if image.format != 'PNG':
                      raise RuntimeError(f'{path} is not a PNG.')
                  image.verify()
              with Image.open(path) as image:
                  image.load()
                  print(f'Valid PNG: {path} ({image.width}x{image.height})')
          PY

      - name: Stamp preview APK with checked-out main commit
        working-directory: apps/mobile
        run: |
          BUILD_GIT_SHA="$(git rev-parse HEAD)"
          export BUILD_GIT_SHA
          node <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          eas.build.preview.env = {
            ...(eas.build.preview.env || {}),
            EXPO_PUBLIC_GIT_SHA: process.env.BUILD_GIT_SHA,
            EXPO_PUBLIC_BUILD_SOURCE: 'main'
          };
          fs.writeFileSync('eas.json', `${JSON.stringify(eas, null, 2)}\n`);
          console.log(`Stamped preview build with ${process.env.BUILD_GIT_SHA}`);
          NODE

      - name: Verify Expo authentication
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "EXPO_TOKEN repository secret is required."
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EAS project link
        working-directory: apps/mobile
        run: |
          node -e "const app=require('./app.json'); if (!app.expo?.extra?.eas?.projectId) { console.error('Missing expo.extra.eas.projectId. Run eas init once and commit the generated project ID.'); process.exit(1); }"

      - name: Final newest-main gate before EAS build
        run: |
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          CHECKED_OUT="$(git rev-parse HEAD)"
          if [ "${CHECKED_OUT}" != "${CURRENT_MAIN}" ]; then
            echo "Refusing stale APK build. Checked out ${CHECKED_OUT}, latest main is ${CURRENT_MAIN}."
            exit 1
          fi

      - name: Cancel stale Expo preview builds
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          CURRENT_SHA="$(git rev-parse HEAD)"
          : > /tmp/stale-eas-builds.txt

          for STATUS in new in-queue in-progress; do
            npx eas-cli@latest build:list \
              --platform android \
              --build-profile preview \
              --status "${STATUS}" \
              --limit 50 \
              --json > "/tmp/eas-${STATUS}.json"

            node - "/tmp/eas-${STATUS}.json" <<'NODE' >> /tmp/stale-eas-builds.txt
          const fs = require('fs');
          const path = process.argv[2];
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const builds = Array.isArray(data) ? data : [];
          for (const build of builds) {
            if (build?.id && build?.gitCommitHash) {
              console.log(`${build.id} ${build.gitCommitHash}`);
            }
          }
          NODE
          done

          sort -u /tmp/stale-eas-builds.txt -o /tmp/stale-eas-builds.txt

          while read -r BUILD_ID BUILD_SHA; do
            [ -n "${BUILD_ID}" ] || continue
            [ -n "${BUILD_SHA}" ] || continue
            [ "${BUILD_SHA}" != "${CURRENT_SHA}" ] || continue

            if git cat-file -e "${BUILD_SHA}^{commit}" 2>/dev/null && git merge-base --is-ancestor "${BUILD_SHA}" "${CURRENT_SHA}"; then
              echo "Cancelling stale Expo build ${BUILD_ID} from ${BUILD_SHA}; newest main is ${CURRENT_SHA}."
              npx eas-cli@latest build:cancel "${BUILD_ID}" --non-interactive
            else
              echo "Leaving Expo build ${BUILD_ID} (${BUILD_SHA}) alone because it is not a confirmed older ancestor of current main."
            fi
          done < /tmp/stale-eas-builds.txt

      - name: Build installable Android preview
        working-directory: apps/mobile
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --clear-cache
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
