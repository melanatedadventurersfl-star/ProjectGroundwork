name: EAS Android Preview

on:
  push:
    branches:
      - main
    paths:
      # Only changes that can affect the installed/native app should
      # automatically consume an EAS Android build.
      - 'apps/mobile/app.json'
      - 'apps/mobile/eas.json'
      - 'apps/mobile/package.json'
      - 'apps/mobile/android/**'
      - 'apps/mobile/assets/ma-app-icon.png'
      - 'apps/mobile/assets/ma-splash-icon.png'
      - 'apps/mobile/assets/ma-pathfinder-mark.png'
  workflow_dispatch:

concurrency:
  group: eas-preview-android-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Normalize Pathfinder launcher PNG for Expo prebuild
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path('apps/mobile/assets/ma-pathfinder-mark.png')
          temp = path.with_name('ma-pathfinder-mark.normalized.png')

          with Image.open(path) as image:
              image.load()
              image.convert('RGBA').save(temp, format='PNG', optimize=False)

          temp.replace(path)
          print(f'Normalized {path} for Expo Android image processing.')
          PY

      - name: Verify Expo authentication
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "EXPO_TOKEN repository secret is required."
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EAS project link
        working-directory: apps/mobile
        run: |
          node -e "const app=require('./app.json'); if (!app.expo?.extra?.eas?.projectId) { console.error('Missing expo.extra.eas.projectId. Run eas init once and commit the generated project ID.'); process.exit(1); }"

      - name: Build installable Android preview
        working-directory: apps/mobile
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
