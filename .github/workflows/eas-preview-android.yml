name: EAS Android Preview

on:
  workflow_run:
    workflows:
      - Mobile CI
    types:
      - completed
  workflow_dispatch:

# Preview builds are delivery jobs, not disposable validation jobs. Once a
# validated build starts, later commits wait their turn instead of cancelling it.
concurrency:
  group: eas-preview-android-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check out validated delivery commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify build target
        run: |
          CHECKED_OUT="$(git rev-parse HEAD)"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "target_sha=${TARGET_SHA}"
          echo "checked_out=${CHECKED_OUT}"
          test "${CHECKED_OUT}" = "${TARGET_SHA}" || {
            echo "Checked-out commit does not match the validated delivery SHA."
            exit 1
          }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Canonicalize native Android PNG assets
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          paths = [
              Path('apps/mobile/assets/ma-app-icon.png'),
              Path('apps/mobile/assets/ma-splash-icon.png'),
              Path('apps/mobile/assets/ma-pathfinder-mark.png'),
          ]

          for path in paths:
              temp = path.with_name(path.stem + '.canonical.png')
              with Image.open(path) as image:
                  image.load()
                  image.convert('RGBA').save(
                      temp,
                      format='PNG',
                      optimize=False,
                      compress_level=6,
                  )
              temp.replace(path)
              print(f'Canonicalized {path}')
          PY

      - name: Canonicalize Trailhead image assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          root = Path('apps/mobile/assets/trailhead')
          images = sorted([*root.rglob('*.jpg'), *root.rglob('*.jpeg'), *root.rglob('*.png')])
          if not images:
              raise RuntimeError('No native Trailhead image assets were found.')

          for path in images:
              suffix = path.suffix.lower()
              temp = path.with_name(f'{path.stem}.canonical{suffix}')
              with Image.open(path) as image:
                  image.load()
                  if suffix in {'.jpg', '.jpeg'}:
                      image.convert('RGB').save(temp, format='JPEG', quality=92, optimize=False)
                  else:
                      image.convert('RGBA').save(temp, format='PNG', optimize=False, compress_level=6)
              temp.replace(path)
              print(f'Canonicalized Trailhead asset: {path}')
          PY

      - name: Re-verify all native image assets before EAS upload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          native_pngs = [
              Path('apps/mobile/assets/ma-app-icon.png'),
              Path('apps/mobile/assets/ma-splash-icon.png'),
              Path('apps/mobile/assets/ma-pathfinder-mark.png'),
          ]
          trailhead_root = Path('apps/mobile/assets/trailhead')
          trailhead_images = sorted([*trailhead_root.rglob('*.jpg'), *trailhead_root.rglob('*.jpeg'), *trailhead_root.rglob('*.png')])

          for path in native_pngs:
              with Image.open(path) as image:
                  if image.format != 'PNG':
                      raise RuntimeError(f'{path} is not a PNG.')
                  image.verify()
              with Image.open(path) as image:
                  image.load()
                  print(f'Valid native PNG: {path} ({image.width}x{image.height})')

          if not trailhead_images:
              raise RuntimeError('No native Trailhead image assets were found.')

          for path in trailhead_images:
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  image.load()
                  if image.width < 480 or image.height < 180:
                      raise RuntimeError(f'Trailhead asset is too small: {path} ({image.width}x{image.height})')
                  print(f'Valid Trailhead asset: {path} ({image.width}x{image.height}, {image.format})')
          PY

      - name: Stamp preview APK with validated commit
        working-directory: apps/mobile
        run: |
          BUILD_GIT_SHA="$(git rev-parse HEAD)"
          export BUILD_GIT_SHA
          node <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          eas.build.preview.env = {
            ...(eas.build.preview.env || {}),
            EXPO_PUBLIC_GIT_SHA: process.env.BUILD_GIT_SHA,
            EXPO_PUBLIC_BUILD_SOURCE: 'main'
          };
          fs.writeFileSync('eas.json', `${JSON.stringify(eas, null, 2)}\n`);
          console.log(`Stamped preview build with ${process.env.BUILD_GIT_SHA}`);
          NODE

      - name: Verify Expo authentication
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "EXPO_TOKEN repository secret is required."
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EAS project link
        working-directory: apps/mobile
        run: |
          node -e "const app=require('./app.json'); if (!app.expo?.extra?.eas?.projectId) { console.error('Missing expo.extra.eas.projectId. Run eas init once and commit the generated project ID.'); process.exit(1); }"

      - name: Re-verify pinned delivery target
        run: |
          CHECKED_OUT="$(git rev-parse HEAD)"
          test "${CHECKED_OUT}" = "${TARGET_SHA}" || {
            echo "Build target changed unexpectedly."
            exit 1
          }

      - name: Build installable Android preview
        working-directory: apps/mobile
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --clear-cache
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
