name: Mobile lint autofix temp

on:
  push:
    branches:
      - chore/mobile-lint-optimization

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: chore/mobile-lint-optimization
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Apply safe ESLint fixes
        run: npm --workspace @ma/mobile run lint -- --fix
      - name: Commit autofixes when needed
        run: |
          if git diff --quiet; then
            echo "No autofixes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile
          git commit -m "Apply mobile lint autofixes"
          git push origin HEAD:chore/mobile-lint-optimization
