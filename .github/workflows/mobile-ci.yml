name: Mobile CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ci.yml'

# Never silently discard a validation run. Rapid pushes to the same ref wait
# their turn instead of cancelling each other. A successful push validation is
# the gate that releases the matching commit to the Android preview workflow.
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate mobile
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show validation target
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "checked_out=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}" || {
            echo "Checked-out commit does not match the workflow event SHA."
            exit 1
          }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify lockfile exists
        run: test -f package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Strictly validate native PNG assets
        run: node apps/mobile/scripts/validate_native_assets.mjs

      - name: Install image validator
        run: python3 -m pip install --quiet pillow

      - name: Validate every Trailhead image through production canonicalization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True

          root = Path('apps/mobile/assets/trailhead')
          images = sorted([*root.rglob('*.jpg'), *root.rglob('*.jpeg'), *root.rglob('*.png')])
          if not images:
              raise RuntimeError('No native Trailhead image assets were found.')

          failures = []
          recovered = []

          with TemporaryDirectory() as temp_dir:
              temp_root = Path(temp_dir)

              for index, path in enumerate(images):
                  try:
                      suffix = path.suffix.lower()
                      if suffix not in {'.jpg', '.jpeg', '.png'}:
                          raise RuntimeError(f'unsupported extension: {suffix}')

                      with Image.open(path) as source:
                          source.load()
                          width, height = source.size
                          source_format = source.format

                          if width < 480 or height < 180:
                              raise RuntimeError(f'image is too small: {width}x{height}')
                          if suffix in {'.jpg', '.jpeg'} and source_format != 'JPEG':
                              raise RuntimeError(f'extension says JPEG but file format is {source_format}')
                          if suffix == '.png' and source_format != 'PNG':
                              raise RuntimeError(f'extension says PNG but file format is {source_format}')

                          clean_path = temp_root / f'{index}{suffix}'
                          if suffix in {'.jpg', '.jpeg'}:
                              source.convert('RGB').save(clean_path, format='JPEG', quality=92, optimize=False)
                          else:
                              source.convert('RGBA').save(clean_path, format='PNG', optimize=False, compress_level=6)

                      with Image.open(clean_path) as clean:
                          clean.verify()
                      with Image.open(clean_path) as clean:
                          clean.load()
                          if clean.width != width or clean.height != height:
                              raise RuntimeError(
                                  f'canonicalization changed dimensions: {width}x{height} -> {clean.width}x{clean.height}'
                              )

                      recovered.append(str(path))
                      print(f'Validated recoverable Trailhead asset: {path} ({width}x{height}, {source_format})')
                  except Exception as exc:
                      failures.append(f'{path}: {exc}')

          if failures:
              raise RuntimeError('Trailhead asset validation failed:\n' + '\n'.join(failures))

          print(f'Validated {len(recovered)} Trailhead image(s) through the same recovery path used before EAS upload.')
          PY

      - name: Lint mobile app
        run: npm run mobile:lint

      - name: Type-check mobile app
        run: npm run mobile:typecheck
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

      - name: Verify repository stayed clean
        run: |
          git restore -- apps/mobile/assets/ma-app-icon.png
          if ! git diff --quiet; then
            echo "CI changed tracked files. Validation must be read-only."
            git diff --stat
            exit 1
          fi
