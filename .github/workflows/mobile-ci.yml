name: Mobile CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ci.yml'

# Never silently discard a validation run. Rapid pushes to the same ref wait
# their turn instead of cancelling each other.
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate mobile
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show validation target
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "checked_out=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}" || {
            echo "Checked-out commit does not match the workflow event SHA."
            exit 1
          }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify lockfile exists
        run: test -f package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Strictly validate native PNG assets
        run: node apps/mobile/scripts/validate_native_assets.mjs

      - name: Install image validator
        run: python3 -m pip install --quiet pillow

      - name: Strictly validate every Trailhead image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('apps/mobile/assets/trailhead')
          images = sorted([*root.rglob('*.jpg'), *root.rglob('*.jpeg'), *root.rglob('*.png')])
          if not images:
              raise RuntimeError('No native Trailhead image assets were found.')

          failures = []
          for path in images:
              try:
                  with Image.open(path) as image:
                      image.verify()
                  with Image.open(path) as image:
                      image.load()
                      width, height = image.size
                      image_format = image.format
                      if width < 480 or height < 180:
                          raise RuntimeError(f'image is too small: {width}x{height}')
                      if path.suffix.lower() in {'.jpg', '.jpeg'} and image_format != 'JPEG':
                          raise RuntimeError(f'extension says JPEG but file format is {image_format}')
                      if path.suffix.lower() == '.png' and image_format != 'PNG':
                          raise RuntimeError(f'extension says PNG but file format is {image_format}')
                      print(f'Validated Trailhead asset: {path} ({width}x{height}, {image_format})')
              except Exception as exc:
                  failures.append(f'{path}: {exc}')

          if failures:
              raise RuntimeError('Trailhead asset validation failed:\n' + '\n'.join(failures))
          PY

      - name: Lint mobile app
        run: npm run mobile:lint

      - name: Type-check mobile app
        run: npm run mobile:typecheck
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

      - name: Verify repository stayed clean
        run: |
          git restore -- apps/mobile/assets/ma-app-icon.png
          if ! git diff --quiet; then
            echo "CI changed tracked files. Validation must be read-only."
            git diff --stat
            exit 1
          fi
