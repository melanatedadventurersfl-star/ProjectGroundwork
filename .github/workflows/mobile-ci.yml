name: Mobile CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: write

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair legacy native PNGs on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          paths = [
              Path('apps/mobile/assets/ma-app-icon.png'),
              Path('apps/mobile/assets/ma-splash-icon.png'),
              Path('apps/mobile/assets/ma-pathfinder-mark.png'),
          ]
          for path in paths:
              temp = path.with_name(path.stem + '.repaired.png')
              with Image.open(path) as image:
                  image.load()
                  image.convert('RGBA').save(temp, format='PNG', optimize=False, compress_level=6)
              temp.replace(path)
              print(f'Re-encoded native asset: {path}')
          PY
          if git diff --quiet -- apps/mobile/assets/ma-app-icon.png apps/mobile/assets/ma-splash-icon.png apps/mobile/assets/ma-pathfinder-mark.png; then
            echo "Native assets already have canonical PNG encoding."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/mobile/assets/ma-app-icon.png apps/mobile/assets/ma-splash-icon.png apps/mobile/assets/ma-pathfinder-mark.png
            git commit -m "Repair native PNG asset encoding"
            git push
          fi

      - name: Strictly validate native image assets
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for path in [Path('apps/mobile/assets/ma-app-icon.png'), Path('apps/mobile/assets/ma-splash-icon.png'), Path('apps/mobile/assets/ma-pathfinder-mark.png')]:
              with Image.open(path) as image:
                  if image.format != 'PNG':
                      raise RuntimeError(f'{path} must be a PNG, got {image.format}.')
                  image.verify()
              with Image.open(path) as image:
                  image.load()
                  if image.width <= 0 or image.height <= 0:
                      raise RuntimeError(f'{path} has invalid dimensions {image.size}.')
              print(f'Validated PNG: {path}')
          PY

      - name: Install dependencies
        run: npm install

      - name: Verify lockfile exists
        run: test -f package-lock.json

      - name: Commit generated lockfile
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add generated dependency lockfile"
          git push

      - name: Lint mobile app
        run: npm run mobile:lint

      - name: Type-check mobile app
        run: npm run mobile:typecheck
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

      - name: Expo Android release preflight
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/mobile-export-preflight
        env:
          EXPO_PUBLIC_APP_ENV: preview
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
