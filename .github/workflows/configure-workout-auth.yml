name: Configure Workout Auth

on:
  push:
    branches: [main]
    paths:
      - "apps/member-app-prototype/workout/supabase/config.toml"
      - ".github/workflows/configure-workout-auth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Require Supabase access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is required to push hosted Workout Auth settings."
            exit 1
          fi

      - name: Apply Workout Auth settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: iftnwzqlofhujzulmofu
          SITE_URL: https://melanatedadventurersfl-star.github.io/ProjectGroundwork/workout/
          URI_ALLOW_LIST: https://melanatedadventurersfl-star.github.io/ProjectGroundwork/workout/,https://melanatedadventurersfl-star.github.io/ProjectGroundwork/workout/**
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$(jq -n \
              --arg site "$SITE_URL" \
              --arg redirects "$URI_ALLOW_LIST" \
              '{site_url:$site,uri_allow_list:$redirects,mailer_autoconfirm:true}')"

      - name: Verify Workout Auth settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: iftnwzqlofhujzulmofu
          EXPECTED_SITE_URL: https://melanatedadventurersfl-star.github.io/ProjectGroundwork/workout/
        run: |
          payload="$(curl --fail-with-body --silent --show-error \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"
          echo "$payload" | jq '{site_url,uri_allow_list,mailer_autoconfirm}'
          test "$(echo "$payload" | jq -r '.site_url')" = "$EXPECTED_SITE_URL"
          test "$(echo "$payload" | jq -r '.mailer_autoconfirm')" = "true"
          echo "$payload" | jq -e '.uri_allow_list | contains("https://melanatedadventurersfl-star.github.io/ProjectGroundwork/workout/")' >/dev/null
