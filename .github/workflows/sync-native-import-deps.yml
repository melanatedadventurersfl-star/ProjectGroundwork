name: Sync native import dependency lock

on:
  push:
    branches:
      - feature/native-event-package-import
    paths:
      - 'apps/mobile/package.json'
      - '.github/workflows/sync-native-import-deps.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/native-event-package-import
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Sync lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Sync Expo 57 worklets dependency lockfile'
          git push origin HEAD:feature/native-event-package-import
