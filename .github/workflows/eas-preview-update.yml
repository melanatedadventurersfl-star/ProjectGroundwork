name: EAS Preview OTA Update

# Delivery retrigger marker: member invite UI rollout.
on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/app/**'
      - 'apps/mobile/src/**'
      - 'apps/mobile/assets/**'
      - '.github/workflows/eas-preview-update.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: eas-preview-ota-main
  cancel-in-progress: true

jobs:
  update:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ota]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify this is still the latest main commit
        run: |
          git fetch origin main
          LATEST_MAIN="$(git rev-parse origin/main)"
          CHECKED_OUT="$(git rev-parse HEAD)"
          if [ "${CHECKED_OUT}" != "${LATEST_MAIN}" ]; then
            echo "Stale OTA run. Checked out ${CHECKED_OUT}, latest main is ${LATEST_MAIN}."
            exit 1
          fi
          echo "OTA candidate is current main: ${CHECKED_OUT}"

      - name: Find last successfully built preview APK baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASELINE_SHA="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/eas-preview-android.yml/runs?branch=main&status=success&per_page=1" \
            | python3 -c "import json,sys; data=json.load(sys.stdin); runs=data.get('workflow_runs', []); print(runs[0]['head_sha'] if runs else '')"
          )"

          echo "baseline_sha=${BASELINE_SHA}" >> "${GITHUB_OUTPUT}"
          if [ -n "${BASELINE_SHA}" ]; then
            echo "Last successful preview APK baseline: ${BASELINE_SHA}"
          else
            echo "No successful preview APK baseline found. A fresh APK is required."
          fi

      - name: Guard OTA against installed runtime baseline
        id: runtime_guard
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.baseline_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          REQUEST_APK=false

          if [ -z "${BASELINE_SHA}" ]; then
            REQUEST_APK=true
          elif ! git cat-file -e "${BASELINE_SHA}^{commit}" 2>/dev/null; then
            git fetch origin "${BASELINE_SHA}" || true
          fi

          if [ "${REQUEST_APK}" = false ] && ! git merge-base --is-ancestor "${BASELINE_SHA}" HEAD; then
            echo "Preview APK baseline ${BASELINE_SHA} is not an ancestor of current main."
            REQUEST_APK=true
          fi

          if [ "${REQUEST_APK}" = false ]; then
            NATIVE_CHANGES="$(git diff --name-only "${BASELINE_SHA}" HEAD -- \
              apps/mobile/app.json \
              apps/mobile/app.config.js \
              apps/mobile/app.config.ts \
              apps/mobile/eas.json \
              apps/mobile/package.json \
              package-lock.json \
              apps/mobile/android \
              apps/mobile/ios \
              apps/mobile/plugins \
              apps/mobile/assets/ma-app-icon.png \
              apps/mobile/assets/ma-splash-icon.png \
              apps/mobile/assets/ma-pathfinder-mark.png \
              apps/mobile/assets/trailhead)"

            if [ -n "${NATIVE_CHANGES}" ]; then
              echo "Current main contains runtime-sensitive changes not present in the installed APK baseline:"
              echo "${NATIVE_CHANGES}"
              REQUEST_APK=true
            fi
          fi

          if [ "${REQUEST_APK}" = true ]; then
            echo "skip_ota=true" >> "${GITHUB_OUTPUT}"
            echo "A matching preview APK is required. Dispatching an APK build for the newest main."
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/eas-preview-android.yml/dispatches" \
              -d '{"ref":"main"}'
          else
            echo "skip_ota=false" >> "${GITHUB_OUTPUT}"
            echo "Runtime baseline is compatible. OTA is allowed."
          fi

      - name: Set up Node
        if: ${{ steps.runtime_guard.outputs.skip_ota != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: ${{ steps.runtime_guard.outputs.skip_ota != 'true' }}
        run: npm ci

      - name: Canonicalize mobile PNG assets before OTA export
        if: ${{ steps.runtime_guard.outputs.skip_ota != 'true' }}
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          paths = [
              Path('apps/mobile/assets/ma-app-icon.png'),
              Path('apps/mobile/assets/ma-splash-icon.png'),
              Path('apps/mobile/assets/ma-pathfinder-mark.png'),
          ]

          for path in paths:
              temp = path.with_name(path.stem + '.canonical.png')
              with Image.open(path) as image:
                  image.load()
                  image.convert('RGBA').save(
                      temp,
                      format='PNG',
                      optimize=False,
                      compress_level=6,
                  )
              temp.replace(path)
              print(f'Canonicalized {path}')
          PY

      - name: Strictly verify PNGs before OTA export
        if: ${{ steps.runtime_guard.outputs.skip_ota != 'true' }}
        run: |
          python3 - <<'PY'
          from PIL import Image

          for path in [
              'apps/mobile/assets/ma-app-icon.png',
              'apps/mobile/assets/ma-splash-icon.png',
              'apps/mobile/assets/ma-pathfinder-mark.png',
          ]:
              with Image.open(path) as image:
                  if image.format != 'PNG':
                      raise RuntimeError(f'{path} is not a PNG.')
                  image.verify()
              with Image.open(path) as image:
                  image.load()
                  print(f'Valid PNG: {path} ({image.width}x{image.height})')
          PY

      - name: Use vector fallback for invalid Wet & Wild raster
        if: ${{ steps.runtime_guard.outputs.skip_ota != 'true' }}
        run: |
          sed -i "/legacy-event-2025-wet-wild.*2025-wet-wild.jpg/d" apps/mobile/src/passport/StampArt.tsx

      - name: Verify Expo authentication
        if: ${{ steps.runtime_guard.outputs.skip_ota != 'true' }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "EXPO_TOKEN repository secret is required."
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Debounce rapid main updates
        if: ${{ steps.runtime_guard.outputs.skip_ota != 'true' }}
        run: sleep 20

      - name: Publish preview OTA update only from newest main
        if: ${{ steps.runtime_guard.outputs.skip_ota != 'true' }}
        working-directory: apps/mobile
        run: |
          git fetch origin main
          LATEST_MAIN="$(git rev-parse origin/main)"
          CHECKED_OUT="$(git rev-parse HEAD)"
          if [ "${CHECKED_OUT}" != "${LATEST_MAIN}" ]; then
            echo "Refusing stale OTA publish. Checked out ${CHECKED_OUT}, latest main is ${LATEST_MAIN}."
            exit 1
          fi

          npx eas-cli@latest update \
            --channel preview \
            --platform android \
            --message "main:${CHECKED_OUT:0:8} · ${{ github.event.head_commit.message || 'Manual preview update' }}" \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_APP_ENV: preview
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_SUPABASE_URL: https://hqndxityqrdiiwqyjagu.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wO8rsulmxmOlZCve3z-DIw_wkJrXn4K
