name: EAS Preview OTA Update

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/app/**'
      - 'apps/mobile/src/**'
      - 'apps/mobile/assets/**'
      - 'apps/mobile/scripts/**'
      - 'apps/mobile/app.json'
      - 'apps/mobile/app.config.js'
      - 'apps/mobile/app.config.ts'
      - 'apps/mobile/eas.json'
      - 'apps/mobile/package.json'
      - 'package-lock.json'
      - 'apps/mobile/android/**'
      - 'apps/mobile/ios/**'
      - 'apps/mobile/plugins/**'
      - '.github/workflows/eas-preview-update.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# The newest main commit always wins. Normal JS/UI/image changes are delivered
# OTA immediately. If native/runtime files also changed, request one fresh APK
# in parallel instead of withholding the OTA from already-installed previews.
concurrency:
  group: eas-preview-ota-main
  cancel-in-progress: true

jobs:
  update:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ota]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering mobile commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify delivery target
        run: |
          CHECKED_OUT="$(git rev-parse HEAD)"
          echo "event_sha=${GITHUB_SHA}"
          echo "checked_out=${CHECKED_OUT}"
          test "${CHECKED_OUT}" = "${GITHUB_SHA}" || {
            echo "Checked-out commit does not match the workflow event SHA."
            exit 1
          }

      - name: Find last successfully built preview APK baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASELINE_SHA="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/eas-preview-android.yml/runs?branch=main&status=success&per_page=1" \
            | python3 -c "import json,sys; data=json.load(sys.stdin); runs=data.get('workflow_runs', []); print(runs[0]['head_sha'] if runs else '')"
          )"
          echo "baseline_sha=${BASELINE_SHA}" >> "${GITHUB_OUTPUT}"
          if [ -n "${BASELINE_SHA}" ]; then
            echo "Last successful preview APK baseline: ${BASELINE_SHA}"
          else
            echo "No successful preview APK baseline found. A fresh APK will be requested."
          fi

      - name: Request a fresh APK when native/runtime files changed
        id: runtime_guard
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.baseline_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          REQUEST_APK=false

          if [ -z "${BASELINE_SHA}" ]; then
            REQUEST_APK=true
          elif ! git cat-file -e "${BASELINE_SHA}^{commit}" 2>/dev/null; then
            git fetch origin "${BASELINE_SHA}" || true
          fi

          if [ "${REQUEST_APK}" = false ] && ! git merge-base --is-ancestor "${BASELINE_SHA}" HEAD; then
            echo "Preview APK baseline ${BASELINE_SHA} is not an ancestor of ${GITHUB_SHA}."
            REQUEST_APK=true
          fi

          if [ "${REQUEST_APK}" = false ]; then
            NATIVE_CHANGES="$(git diff --name-only "${BASELINE_SHA}" HEAD -- \
              apps/mobile/app.json \
              apps/mobile/app.config.js \
              apps/mobile/app.config.ts \
              apps/mobile/eas.json \
              apps/mobile/package.json \
              package-lock.json \
              apps/mobile/android \
              apps/mobile/ios \
              apps/mobile/plugins \
              apps/mobile/assets/ma-app-icon.png \
              apps/mobile/assets/ma-splash-icon.png \
              apps/mobile/assets/ma-pathfinder-mark.png)"
            if [ -n "${NATIVE_CHANGES}" ]; then
              echo "Native/runtime changes are newer than the installed APK baseline:"
              echo "${NATIVE_CHANGES}"
              REQUEST_APK=true
            fi
          fi

          echo "request_apk=${REQUEST_APK}" >> "${GITHUB_OUTPUT}"

          if [ "${REQUEST_APK}" = true ]; then
            ACTIVE_BUILD_COUNT="$(
              curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/eas-preview-android.yml/runs?branch=main&per_page=20" \
              | python3 -c "import json,sys; runs=json.load(sys.stdin).get('workflow_runs', []); active={'queued','in_progress','requested','waiting','pending'}; print(sum(1 for run in runs if run.get('status') in active))"
            )"

            if [ "${ACTIVE_BUILD_COUNT}" -gt 0 ]; then
              echo "A preview APK workflow is already active; not dispatching a duplicate."
            else
              echo "Dispatching a fresh preview APK from main."
              curl -fsSL -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/eas-preview-android.yml/dispatches" \
                -d '{"ref":"main"}'
            fi
          else
            echo "Existing preview APK baseline is current for native/runtime files."
          fi

          echo "OTA delivery will continue for this commit either way."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Repair recoverable bundled raster assets before OTA export
        run: |
          python3 -m pip install --quiet pillow
          python3 apps/mobile/scripts/prepare_image_assets.py

      - name: Strictly verify Trailhead images before OTA export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('apps/mobile/assets/trailhead')
          images = sorted([*root.rglob('*.jpg'), *root.rglob('*.jpeg'), *root.rglob('*.png')])
          if not images:
              raise RuntimeError('No native Trailhead image assets were found.')
          for path in images:
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  image.load()
                  if image.width < 480 or image.height < 180:
                      raise RuntimeError(f'Trailhead asset is too small: {path} ({image.width}x{image.height})')
                  print(f'Valid Trailhead asset: {path} ({image.width}x{image.height}, {image.format})')
          PY

      - name: Validate every bundled raster image before OTA export
        run: python3 apps/mobile/scripts/validate_image_assets.py

      - name: Use vector fallback for invalid Wet & Wild raster
        run: sed -i "/legacy-event-2025-wet-wild.*2025-wet-wild.jpg/d" apps/mobile/src/passport/StampArt.tsx

      - name: Verify Expo authentication
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "EXPO_TOKEN repository secret is required."
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Debounce rapid mobile updates
        run: sleep 20

      - name: Publish preview OTA for triggering commit
        working-directory: apps/mobile
        run: |
          CHECKED_OUT="$(git rev-parse HEAD)"
          test "${CHECKED_OUT}" = "${GITHUB_SHA}" || {
            echo "Delivery target changed unexpectedly."
            exit 1
          }
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export EXPO_PUBLIC_BUILD_TIMESTAMP="${BUILD_TIMESTAMP}"
          npx eas-cli@latest update \
            --channel preview \
            --platform android \
            --message "main:${CHECKED_OUT:0:8} · ${{ github.event.head_commit.message || 'Manual preview update' }}" \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_APP_ENV: preview
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_BUILD_PROFILE: preview-ota
          EXPO_PUBLIC_SUPABASE_URL: https://hqndxityqrdiiwqyjagu.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wO8rsulmxmOlZCve3z-DIw_wkJrXn4K
