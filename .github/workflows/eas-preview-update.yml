name: EAS Preview OTA Update

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/app/**'
      - 'apps/mobile/src/**'
      - 'apps/mobile/assets/**'
      - 'apps/mobile/scripts/**'
      - 'apps/mobile/app.json'
      - 'apps/mobile/app.config.js'
      - 'apps/mobile/app.config.ts'
      - 'apps/mobile/eas.json'
      - 'apps/mobile/package.json'
      - 'package-lock.json'
      - 'apps/mobile/android/**'
      - 'apps/mobile/ios/**'
      - 'apps/mobile/plugins/**'
      - '.github/workflows/eas-preview-update.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Every main commit that changes the mobile experience gets a publish attempt.
# Do not cancel an in-flight OTA publish when another merge lands: cancelling
# between bundle upload and channel assignment can leave installed previews
# behind while GitHub appears healthy.
concurrency:
  group: eas-preview-ota-main
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ota]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out triggering mobile commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify publish target
        shell: bash
        run: |
          set -euo pipefail
          CHECKED_OUT="$(git rev-parse HEAD)"
          echo "event_sha=${GITHUB_SHA}"
          echo "checked_out=${CHECKED_OUT}"
          test "${CHECKED_OUT}" = "${GITHUB_SHA}"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Load preview bundle environment
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_ENV"
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('apps/mobile/eas.json', 'utf8'));
          const preview = eas?.build?.preview?.env || {};
          const required = [
            'EXPO_PUBLIC_APP_ENV',
            'EXPO_PUBLIC_SUPABASE_URL',
            'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY',
          ];
          for (const name of required) {
            const value = preview[name];
            if (typeof value !== 'string' || value.trim().length === 0) {
              throw new Error(`Missing ${name} in apps/mobile/eas.json preview env`);
            }
            console.log(`${name}=${value}`);
          }
          NODE

      - name: Verify preview runtime environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_PUBLIC_APP_ENV:-}"
          test -n "${EXPO_PUBLIC_SUPABASE_URL:-}"
          test -n "${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}"
          echo "Preview OTA runtime environment is present."

      - name: Require Expo authentication
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN is required. Refusing to report success without publishing an OTA update."
            exit 1
          fi

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Publish preview update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
          EXPO_PUBLIC_BUILD_PROFILE: preview
          EXPO_PUBLIC_BUILD_SOURCE: github-actions-ota
        run: |
          set -euo pipefail
          eas update \
            --channel preview \
            --message "Preview OTA ${GITHUB_SHA}" \
            --non-interactive

      - name: Verify channel received triggering commit
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas channel:view preview --json --non-interactive > /tmp/preview-channel.json
          cat /tmp/preview-channel.json
          grep -q "${GITHUB_SHA}" /tmp/preview-channel.json || {
            echo "Preview channel does not reference triggering commit ${GITHUB_SHA}."
            exit 1
          }
          echo "Verified preview OTA for ${GITHUB_SHA}."
