name: EAS Preview OTA Update

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/app/**'
      - 'apps/mobile/src/**'
      - 'apps/mobile/assets/**'
      - '.github/workflows/eas-preview-update.yml'
  workflow_dispatch:

concurrency:
  group: eas-preview-ota-main
  cancel-in-progress: true

jobs:
  update:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ota]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify this is still the latest main commit
        if: ${{ github.event_name == 'push' }}
        run: |
          git fetch origin main
          LATEST_MAIN="$(git rev-parse origin/main)"
          if [ "${GITHUB_SHA}" != "${LATEST_MAIN}" ]; then
            echo "Skipping stale OTA publish. Triggered SHA ${GITHUB_SHA}, latest main is ${LATEST_MAIN}."
            exit 1
          fi

      - name: Block OTA when native runtime changed
        if: ${{ github.event_name == 'push' }}
        id: runtime_guard
        run: |
          BASE_SHA="${{ github.event.before }}"
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${GITHUB_SHA}^"
          fi

          NATIVE_CHANGES="$(git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}" -- \
            apps/mobile/app.json \
            apps/mobile/eas.json \
            apps/mobile/package.json \
            package-lock.json \
            apps/mobile/android \
            apps/mobile/ios)"

          if [ -n "${NATIVE_CHANGES}" ]; then
            echo "Native-runtime-sensitive files changed:"
            echo "${NATIVE_CHANGES}"
            echo "skip_ota=true" >> "${GITHUB_OUTPUT}"
            echo "Skipping OTA. A fresh preview APK must establish the new native runtime first."
          else
            echo "skip_ota=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Node
        if: ${{ steps.runtime_guard.outputs.skip_ota != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: ${{ steps.runtime_guard.outputs.skip_ota != 'true' }}
        run: npm ci

      - name: Canonicalize mobile PNG assets before OTA export
        if: ${{ steps.runtime_guard.outputs.skip_ota != 'true' }}
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          paths = [
              Path('apps/mobile/assets/ma-app-icon.png'),
              Path('apps/mobile/assets/ma-splash-icon.png'),
              Path('apps/mobile/assets/ma-pathfinder-mark.png'),
          ]

          for path in paths:
              temp = path.with_name(path.stem + '.canonical.png')
              with Image.open(path) as image:
                  image.load()
                  image.convert('RGBA').save(
                      temp,
                      format='PNG',
                      optimize=False,
                      compress_level=6,
                  )
              temp.replace(path)
              print(f'Canonicalized {path}')
          PY

      - name: Strictly verify PNGs before OTA export
        if: ${{ steps.runtime_guard.outputs.skip_ota != 'true' }}
        run: |
          python3 - <<'PY'
          from PIL import Image

          for path in [
              'apps/mobile/assets/ma-app-icon.png',
              'apps/mobile/assets/ma-splash-icon.png',
              'apps/mobile/assets/ma-pathfinder-mark.png',
          ]:
              with Image.open(path) as image:
                  if image.format != 'PNG':
                      raise RuntimeError(f'{path} is not a PNG.')
                  image.verify()
              with Image.open(path) as image:
                  image.load()
                  print(f'Valid PNG: {path} ({image.width}x{image.height})')
          PY

      - name: Use vector fallback for invalid Wet & Wild raster
        if: ${{ steps.runtime_guard.outputs.skip_ota != 'true' }}
        run: |
          sed -i "/legacy-event-2025-wet-wild.*2025-wet-wild.jpg/d" apps/mobile/src/passport/StampArt.tsx

      - name: Verify Expo authentication
        if: ${{ steps.runtime_guard.outputs.skip_ota != 'true' }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "EXPO_TOKEN repository secret is required."
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish preview OTA update
        if: ${{ steps.runtime_guard.outputs.skip_ota != 'true' }}
        working-directory: apps/mobile
        run: npx eas-cli@latest update --channel preview --platform android --message "main:${GITHUB_SHA::8} · ${{ github.event.head_commit.message || 'Manual preview update' }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_APP_ENV: preview
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_SUPABASE_URL: https://hqndxityqrdiiwqyjagu.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wO8rsulmxmOlZCve3z-DIw_wkJrXn4K
