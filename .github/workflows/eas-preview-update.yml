name: EAS Preview OTA Update

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/app/**'
      - 'apps/mobile/src/**'
      - 'apps/mobile/assets/**'
      - 'apps/mobile/scripts/**'
      - 'apps/mobile/app.json'
      - 'apps/mobile/app.config.js'
      - 'apps/mobile/app.config.ts'
      - 'apps/mobile/eas.json'
      - 'apps/mobile/package.json'
      - 'package-lock.json'
      - 'apps/mobile/android/**'
      - 'apps/mobile/ios/**'
      - 'apps/mobile/plugins/**'
      - '.github/workflows/eas-preview-update.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# The newest main commit always wins. Normal JS/UI/image changes are delivered
# OTA immediately. If native/runtime files also changed, request one fresh APK
# in parallel instead of withholding the OTA from already-installed previews.
# Retriggered 2026-08-24 21:54 ET to deliver the community-thread white-screen fix.
concurrency:
  group: eas-preview-ota-main
  cancel-in-progress: true

jobs:
  update:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ota]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering mobile commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Expo account
        id: expo-account
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "No EXPO_TOKEN available; OTA publish cannot run."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Install EAS CLI
        if: steps.expo-account.outputs.has_token == 'true'
        run: npm install --global eas-cli

      - name: Publish preview update
        if: steps.expo-account.outputs.has_token == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --channel preview --message "Preview OTA ${{ github.sha }}" --non-interactive

      - name: Note skipped publish
        if: steps.expo-account.outputs.has_token != 'true'
        run: echo "Skipped OTA publish because EXPO_TOKEN is not configured."
