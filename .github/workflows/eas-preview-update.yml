name: EAS Preview OTA Update

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/app/**'
      - 'apps/mobile/src/**'
      - 'apps/mobile/assets/**'
      - 'apps/mobile/scripts/**'
      - 'apps/mobile/app.json'
      - 'apps/mobile/app.config.js'
      - 'apps/mobile/app.config.ts'
      - 'apps/mobile/eas.json'
      - 'apps/mobile/package.json'
      - 'package-lock.json'
      - 'apps/mobile/android/**'
      - 'apps/mobile/ios/**'
      - 'apps/mobile/plugins/**'
      - '.github/workflows/eas-preview-update.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: eas-preview-ota-main
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ota]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out triggering mobile commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify publish target
        shell: bash
        run: |
          set -euo pipefail
          CHECKED_OUT="$(git rev-parse HEAD)"
          echo "event_sha=${GITHUB_SHA}"
          echo "checked_out=${CHECKED_OUT}"
          test "${CHECKED_OUT}" = "${GITHUB_SHA}"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Load preview bundle environment
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_ENV"
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('apps/mobile/eas.json', 'utf8'));
          const preview = eas?.build?.preview?.env || {};
          const required = [
            'EXPO_PUBLIC_APP_ENV',
            'EXPO_PUBLIC_SUPABASE_URL',
            'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY',
          ];
          for (const name of required) {
            const value = preview[name];
            if (typeof value !== 'string' || value.trim().length === 0) {
              throw new Error(`Missing ${name} in apps/mobile/eas.json preview env`);
            }
            console.log(`${name}=${value}`);
          }
          NODE

      - name: Compose member-facing What's New manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_ENV"
          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const token = process.env.GITHUB_TOKEN;
          const runNumber = process.env.GITHUB_RUN_NUMBER;
          const commitMessage = process.env.COMMIT_MESSAGE || '';

          async function getAssociatedPullRequest() {
            try {
              const response = await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/pulls`, {
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: `Bearer ${token}`,
                  'X-GitHub-Api-Version': '2022-11-28',
                },
              });
              if (!response.ok) return null;
              const prs = await response.json();
              return Array.isArray(prs) ? (prs.find((pr) => pr.merged_at) || prs[0] || null) : null;
            } catch {
              return null;
            }
          }

          const featureLibrary = [
            {
              id: 'ask-go',
              matches: ['ask go', 'member ai', 'adventure concierge', 'member guide'],
              title: 'Ask Go got smarter',
              body: 'Have a real conversation, refine what you want, and get stronger nearby adventure recommendations and lightweight day plans.',
              ctaLabel: 'Try Ask Go',
              href: '/trail-guide/ask',
            },
            {
              id: 'outpost',
              matches: ['outpost', 'campfire', 'community digest'],
              title: 'Outpost feels more alive',
              body: 'Catch up on meaningful community activity, upcoming Outings, and the conversations that matter without digging through an endless feed.',
              ctaLabel: 'Open Outpost',
              href: '/(tabs)/community',
            },
            {
              id: 'communities',
              matches: ['communities', 'community hub', 'official communities'],
              title: 'Communities are easier to discover',
              body: 'Official communities, joined groups, nearby options, and recent activity now have a clearer, richer home.',
              href: '/(tabs)/community',
            },
            {
              id: 'outings',
              matches: ['outing', 'local event', 'event photo', 'outing photo'],
              title: 'Outings are easier to manage',
              body: 'Creating and managing real-world plans is getting smoother, including richer outing details and photos where available.',
            },
            {
              id: 'trail-guide',
              matches: ['trail guide', 'trail-guide', 'city guide', 'trailhead'],
              title: 'Adventure discovery keeps getting better',
              body: 'Trail Guide and Trailhead improvements make it easier to find relevant places, understand what fits, and move from browsing to doing.',
              ctaLabel: 'Explore Trail Guide',
              href: '/trail-guide',
            },
            {
              id: 'host',
              matches: ['host', 'copilot', 'waitlist', 'registration question'],
              title: 'Hosts have better planning tools',
              body: 'New host tools make it easier to plan outings, manage people, and keep the important trip details organized.',
              audience: ['host', 'admin'],
            },
            {
              id: 'safety',
              matches: ['moderation', 'report', 'appeal', 'warning', 'block'],
              title: 'Community safety tools are stronger',
              body: 'Reporting, moderation, and member-safety flows have been tightened so issues are easier to handle consistently.',
            },
            {
              id: 'profile',
              matches: ['profile', 'rank', 'member page'],
              title: 'Profiles got more polish',
              body: 'Member profiles and identity surfaces are cleaner, easier to read, and better organized.',
            },
            {
              id: 'updates',
              matches: ['stale cached', 'cached build', 'white screen', 'update activation', 'restart & update', 'ota activation'],
              title: 'Updates are more reliable',
              body: 'Go Melanated now does a better job activating downloaded updates and recovering when a device tries to reopen an older cached version.',
            },
          ];

          const currentWave = [
            featureLibrary.find((feature) => feature.id === 'ask-go'),
            featureLibrary.find((feature) => feature.id === 'outpost'),
            featureLibrary.find((feature) => feature.id === 'communities'),
            featureLibrary.find((feature) => feature.id === 'outings'),
            featureLibrary.find((feature) => feature.id === 'updates'),
          ].filter(Boolean);

          (async () => {
            const pr = await getAssociatedPullRequest();
            const source = `${pr?.title || ''}\n${pr?.body || ''}\n${commitMessage}`.toLowerCase();
            const releaseInfrastructureOnly =
              /(release[- ]?note|what['’]?s new|release manifest|expo_public_release)/.test(source) &&
              !/(ask go|outpost|communities|outing|trail guide|host|moderation|profile)/.test(source);

            let features = releaseInfrastructureOnly
              ? currentWave
              : featureLibrary.filter((feature) => feature.matches.some((match) => source.includes(match)));

            const seen = new Set();
            features = features.filter((feature) => {
              if (!feature || seen.has(feature.id)) return false;
              seen.add(feature.id);
              return true;
            }).slice(0, 5);

            if (!features.length) {
              features = [{
                id: 'polish',
                title: 'Go Melanated keeps getting smoother',
                body: 'This update includes usability, reliability, and performance improvements across the app.',
              }];
            }

            const major = features.length >= 3;
            const manifest = {
              id: `ota-${sha}`,
              title: "What's New",
              subtitle: major ? 'More ways to discover, connect, and go.' : features[0].title,
              intro: major
                ? 'Here are the biggest improvements included in this update.'
                : 'A focused improvement just landed in Go Melanated.',
              dateLabel: new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(new Date()),
              versionLabel: runNumber ? `Preview ${runNumber}` : undefined,
              features: features.map(({ matches, ...feature }) => feature),
              footer: major ? 'Plus smaller reliability and polish improvements across the app.' : undefined,
            };

            console.log(`EXPO_PUBLIC_RELEASE_MANIFEST=${JSON.stringify(manifest)}`);
            console.error('Composed member-facing release manifest:', manifest);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify preview runtime environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_PUBLIC_APP_ENV:-}"
          test -n "${EXPO_PUBLIC_SUPABASE_URL:-}"
          test -n "${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}"
          test -n "${EXPO_PUBLIC_RELEASE_MANIFEST:-}"
          node -e 'const m=JSON.parse(process.env.EXPO_PUBLIC_RELEASE_MANIFEST); if(!m.id || !Array.isArray(m.features) || !m.features.length) process.exit(1)'
          echo "Preview OTA runtime environment and member-facing release manifest are present."

      - name: Require Expo authentication
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN is required. Refusing to report success without publishing an OTA update."
            exit 1
          fi

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Publish preview update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
          EXPO_PUBLIC_BUILD_PROFILE: preview
          EXPO_PUBLIC_BUILD_SOURCE: github-actions-ota
        run: |
          set -euo pipefail
          eas update \
            --channel preview \
            --message "Preview OTA ${GITHUB_SHA}" \
            --non-interactive

      - name: Verify channel received triggering commit
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas channel:view preview --json --non-interactive > /tmp/preview-channel.json
          cat /tmp/preview-channel.json
          grep -q "${GITHUB_SHA}" /tmp/preview-channel.json || {
            echo "Preview channel does not reference triggering commit ${GITHUB_SHA}."
            exit 1
          }
          echo "Verified preview OTA for ${GITHUB_SHA}."
