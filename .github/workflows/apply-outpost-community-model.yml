name: Apply Outpost community model patches

on:
  push:
    branches:
      - feature/outpost-community-model

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[outpost-model]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/outpost-community-model
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new))

          replace(
              'apps/mobile/src/community/FeaturedCampfireCarousel.tsx',
              "const TEXT_CARD_HEIGHT = 194;",
              "const TEXT_CARD_HEIGHT = IMAGE_CARD_HEIGHT;",
          )

          replace(
              'apps/mobile/src/community/api.ts',
              "  kind: 'adventure' | 'interest' | 'local';\n  adventure_id: string | null;",
              "  kind: 'adventure' | 'interest' | 'local';\n  management_type?: 'official' | 'member_led';\n  community_type?: 'host' | 'member_led' | 'official' | 'private';\n  owner_type?: 'platform' | 'host' | 'member';\n  host_profile_id?: string | null;\n  created_by?: string | null;\n  is_topic?: boolean;\n  adventure_id: string | null;",
          )
          replace(
              'apps/mobile/src/community/api.ts',
              ".select('id, name, description, kind, adventure_id, city, state, image_url, cover_image_url, visibility')",
              ".select('id, name, description, kind, management_type, community_type, owner_type, host_profile_id, created_by, is_topic, adventure_id, city, state, image_url, cover_image_url, visibility')",
          )

          group = 'apps/mobile/app/groups/[id].tsx'
          replace(
              group,
              "import { supabase } from '../../src/lib/supabase';",
              "import type { AdventureSummary } from '../../src/adventures/types';\nimport { CommunityHostOutingsPanel } from '../../src/community/CommunityHostOutingsPanel';\nimport { listCommunityHostOutings } from '../../src/community/communityOutings';\nimport { supabase } from '../../src/lib/supabase';",
          )
          replace(
              group,
              "type GroupTab = 'feed' | 'learn' | 'campfire' | 'members' | 'about';",
              "type GroupTab = 'feed' | 'learn' | 'outings' | 'campfire' | 'members' | 'about';",
          )
          replace(
              group,
              "  const [campfires, setCampfires] = useState<LocalEvent[]>([]);",
              "  const [campfires, setCampfires] = useState<LocalEvent[]>([]);\n  const [hostOutings, setHostOutings] = useState<AdventureSummary[]>([]);",
          )
          replace(
              group,
              "      const [nextPosts, nextCampfires, nextAccess, memberResult] = await Promise.all([\n        getCommunityFeed(undefined, id),\n        isLocal ? listGroupCampfires(id).catch(() => []) : Promise.resolve([]),\n        isLocal ? getGroupCampfireAccess(id).catch(() => false) : Promise.resolve(false),\n        supabase.rpc('get_group_member_directory', { target_group_id: id }),\n      ]);",
              "      const [nextPosts, nextCampfires, nextHostOutings, nextAccess, memberResult] = await Promise.all([\n        getCommunityFeed(undefined, id),\n        isLocal ? listGroupCampfires(id).catch(() => []) : Promise.resolve([]),\n        listCommunityHostOutings(id).catch(() => []),\n        isLocal ? getGroupCampfireAccess(id).catch(() => false) : Promise.resolve(false),\n        supabase.rpc('get_group_member_directory', { target_group_id: id }),\n      ]);",
          )
          replace(
              group,
              "      setCampfires(nextCampfires);\n      setCanCreateCampfire(nextAccess);",
              "      setCampfires(nextCampfires);\n      setHostOutings(nextHostOutings);\n      setCanCreateCampfire(nextAccess);",
          )
          replace(
              group,
              "  const communityLabel = localCommunity\n    ? group?.city ? `${group.city.toUpperCase()} COMMUNITY` : 'LOCAL COMMUNITY'\n    : 'OFFICIAL COMMUNITY';",
              "  const communityLabel = group?.community_type === 'host'\n    ? 'HOST COMMUNITY'\n    : group?.community_type === 'official'\n      ? 'GO MELANATED COMMUNITY'\n      : localCommunity\n        ? group?.city ? `${group.city.toUpperCase()} COMMUNITY` : 'LOCAL COMMUNITY'\n        : group?.kind === 'adventure' ? 'TRIP COMMUNITY' : 'MEMBER COMMUNITY';",
          )
          replace(
              group,
              "  const tabItems: [GroupTab, string][] = localCommunity\n    ? [['feed', 'Feed'], ['learn', 'Learn'], ['campfire', 'Campfire'], ['members', 'Members'], ['about', 'About']]\n    : [['feed', 'Feed'], ['learn', 'Learn'], ['members', 'Members'], ['about', 'About']];",
              "  const tabItems: [GroupTab, string][] = localCommunity\n    ? [['feed', 'Posts'], ['outings', 'Outings'], ['campfire', 'Meetups'], ['members', 'Members'], ['about', 'About']]\n    : [['feed', 'Posts'], ['outings', 'Outings'], ['members', 'Members'], ['about', 'About']];",
          )
          marker = "        {localCommunity && activeTab === 'campfire' ? ("
          insert = """        {activeTab === 'outings' ? (\n          <View style={styles.sectionBlock}>\n            <Text style={styles.sectionEyebrow}>COMMUNITY OUTINGS</Text>\n            <Text style={styles.sectionTitle}>What this community is planning</Text>\n            <Text style={styles.sectionIntro}>Published host events appear here automatically from Host Center.</Text>\n            <CommunityHostOutingsPanel outings={hostOutings} />\n          </View>\n        ) : null}\n\n""" + marker
          replace(group, marker, insert)
          replace(
              group,
              "{localCommunity ? 'Learn is curated knowledge. Feed is where members ask questions and share experience. Campfire is for casual local gatherings planned by Community Leaders.' : 'Learn is curated knowledge. Feed is where members ask questions and share experience. Members connects people around the shared interest.'}",
              "{localCommunity ? 'Posts are the conversation. Outings come from linked host events. Meetups are casual local gatherings planned by Community Leaders.' : 'Posts are the conversation. Outings come from linked host events. Members shows the people who make up this community.'}",
          )
          PY
      - name: Commit patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/community/FeaturedCampfireCarousel.tsx apps/mobile/src/community/api.ts 'apps/mobile/app/groups/[id].tsx'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[outpost-model] finish unified community surface"
          git push origin HEAD:feature/outpost-community-model
