name: Patch Opportunities Importer

on:
  push:
    branches:
      - fix/opportunities-mobile-redesign
    paths:
      - .github/workflows/patch-opportunities-importer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/opportunities-mobile-redesign
      - name: Patch Opportunities screen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/app/management/index.tsx')
          text = path.read_text()
          start = text.index('function OpportunitiesSection(){')
          end = text.index('function OpportunityModeButton', start)
          replacement = r'''function OpportunitiesSection(){
  const { width } = useWindowDimensions();
  const mobile = width < 760;
  const [mode,setMode] = useState<'link'|'manual'|'file'>('link');
  const [url,setUrl] = useState('');
  const [importing,setImporting] = useState(false);
  const [importError,setImportError] = useState('');
  const [preview,setPreview] = useState<any>(null);
  const cleanUrl = url.trim();
  const validUrl = /^https?:\/\/\S+/i.test(cleanUrl);
  const selectMode=(next:'link'|'manual'|'file')=>{setMode(next);setPreview(null);setImportError('')};
  const importOpportunity=async()=>{
    if(!validUrl||importing)return;
    setImporting(true);setImportError('');setPreview(null);
    try{
      const { previewOpportunityFromUrl } = await import('../../src/management/opportunities');
      const result = await previewOpportunityFromUrl(cleanUrl);
      setPreview(result.preview);
    }catch(caught){setImportError(caught instanceof Error?caught.message:'Unable to import this opportunity.');}
    finally{setImporting(false);}
  };
  const stages=[['Discovered','New leads and ideas','briefcase'],['Reviewing','Details imported, needs review','search'],['Applied / Contacted','Application submitted or in contact','open'],['Approved','Accepted or confirmed','checkmark'],['Scheduled','On the calendar','calendar']] as const;
  const detailRows = preview ? [
    ['Type', formatLabel(preview.opportunityType || 'other')],
    ['Event date', preview.eventStart || 'Not found'],
    ['Location', [preview.venueName,preview.city,preview.state].filter(Boolean).join(', ') || 'Not found'],
    ['Organizer', preview.organizer || 'Not found'],
    ['Vendor fee', preview.vendorFeeText || 'Not found'],
    ['Application deadline', preview.applicationDeadline || 'Not found'],
    ['Contact', preview.contactEmail || preview.contactPhone || preview.contactName || 'Not found'],
  ] : [];
  return <View style={styles.sectionPage}>
    <View style={[styles.standardHeader,{marginBottom:14}]}><Text style={styles.standardTitle}>Opportunities</Text><Text style={styles.standardSubtitle}>Find and track events, vendors, partnerships and venues.</Text></View>
    <View style={{borderRadius:18,borderWidth:1,borderColor:'#51482B',backgroundColor:'#171912',padding:mobile?13:17,marginBottom:20}}>
      <View style={{flexDirection:'row',gap:6,borderBottomWidth:1,borderBottomColor:COLORS.line,paddingBottom:8,marginBottom:14,flexWrap:'wrap'}}>
        <OpportunityModeButton label="Paste a link" icon="open" active={mode==='link'} onPress={()=>selectMode('link')}/>
        <OpportunityModeButton label="Add manually" icon="add" active={mode==='manual'} onPress={()=>selectMode('manual')}/>
        <OpportunityModeButton label="Import flyer/file" icon="directory" active={mode==='file'} onPress={()=>selectMode('file')}/>
      </View>
      {mode==='link'?<><Text style={{color:COLORS.cream,fontSize:mobile?13:15,fontWeight:'900'}}>Paste event, vendor or venue link</Text><Text style={{color:COLORS.muted,fontSize:10,lineHeight:15,marginTop:3}}>Paste a public page. We will pull in supported opportunity details for your review.</Text><TextInput value={url} onChangeText={(value)=>{setUrl(value);setPreview(null);setImportError('')}} editable autoCapitalize="none" autoCorrect={false} keyboardType="url" placeholder="https://eventbrite.com/e/..." placeholderTextColor={COLORS.dim} style={[styles.urlInput,{marginTop:12,minHeight:48,fontSize:12}]} accessibilityLabel="Opportunity URL"/><Pressable disabled={!validUrl||importing} onPress={()=>void importOpportunity()} style={{minHeight:48,borderRadius:12,backgroundColor:validUrl&&!importing?COLORS.gold:'#40391E',alignItems:'center',justifyContent:'center',marginTop:10,opacity:validUrl?1:.72}}>{importing?<ActivityIndicator color={COLORS.ink}/>:<Text style={{color:validUrl?COLORS.ink:COLORS.dim,fontSize:11,fontWeight:'900'}}>Import opportunity</Text>}</Pressable><Text style={styles.importerNote}>Imported details require review before saving.</Text>{importError?<View style={{marginTop:12,borderRadius:12,borderWidth:1,borderColor:'#6B352E',backgroundColor:'#321D1A',padding:12}}><Text style={{color:COLORS.danger,fontSize:10,fontWeight:'900'}}>IMPORT FAILED</Text><Text style={{color:COLORS.cream,fontSize:9.5,lineHeight:14,marginTop:5}}>{importError}</Text></View>:null}{preview?<View style={{marginTop:12,borderRadius:14,borderWidth:1,borderColor:'#34503D',backgroundColor:'#13231A',padding:13}}><Text style={{color:COLORS.green,fontSize:9,fontWeight:'900',letterSpacing:.8}}>REVIEW IMPORTED DETAILS</Text><Text style={{color:COLORS.cream,fontSize:16,fontWeight:'900',marginTop:6}}>{preview.title || 'Imported opportunity'}</Text>{preview.summary?<Text style={{color:COLORS.muted,fontSize:9.5,lineHeight:14,marginTop:4}}>{preview.summary}</Text>:null}<View style={{marginTop:10,borderTopWidth:1,borderTopColor:'#294032'}}>{detailRows.map(([label,value])=><View key={label} style={{flexDirection:'row',gap:10,paddingVertical:7,borderBottomWidth:1,borderBottomColor:'#22372B'}}><Text style={{width:110,color:COLORS.dim,fontSize:8.5,fontWeight:'900'}}>{label.toUpperCase()}</Text><Text style={{flex:1,color:COLORS.cream,fontSize:9.5}}>{value}</Text></View>)}</View>{preview.boothDetails?.length?<View style={{marginTop:10}}><Text style={{color:COLORS.gold,fontSize:8.5,fontWeight:'900'}}>BOOTH DETAILS</Text>{preview.boothDetails.map((item:string)=><Text key={item} style={{color:COLORS.muted,fontSize:9.5,lineHeight:14,marginTop:3}}>• {item}</Text>)}</View>:null}{preview.requirements?.length?<View style={{marginTop:10}}><Text style={{color:COLORS.gold,fontSize:8.5,fontWeight:'900'}}>REQUIREMENTS</Text>{preview.requirements.map((item:string)=><Text key={item} style={{color:COLORS.muted,fontSize:9.5,lineHeight:14,marginTop:3}}>• {item}</Text>)}</View>:null}{preview.confidenceNotes?.length?<View style={{marginTop:10}}><Text style={{color:COLORS.gold,fontSize:8.5,fontWeight:'900'}}>REVIEW NOTES</Text>{preview.confidenceNotes.map((item:string)=><Text key={item} style={{color:COLORS.muted,fontSize:9,lineHeight:13,marginTop:3}}>• {item}</Text>)}</View>:null}<Text style={{color:COLORS.dim,fontSize:8.5,marginTop:10}} numberOfLines={2}>Source: {preview.sourceUrl || cleanUrl}</Text></View>:null}</>:mode==='manual'?<EmptyInline icon="add" title="Manual opportunity entry" copy="Manual record fields will live in this workflow instead of a separate page."/>:<EmptyInline icon="directory" title="Flyer and file import" copy="This slot is reserved for flyer, screenshot and vendor-packet import."/>}
    </View>
    <PanelHeader eyebrow="NEEDS ATTENTION" title={preview?'Review imported opportunity':'Nothing needs review yet'} action={preview?'1 item':'0 items'}/><View style={styles.panelCard}>{preview?<EmptyInline icon="search" title={preview.title || 'Imported opportunity'} copy="Review the extracted fields above before this becomes a saved opportunity."/>:<EmptyInline icon="checkmark" title="No opportunity alerts" copy="Deadlines, follow-ups and imported records that need review will appear here."/>}</View>
    <Text style={[styles.pipelineTitle,{marginTop:3}]}>PIPELINE</Text>
    {mobile?<View style={{borderRadius:16,borderWidth:1,borderColor:COLORS.line,backgroundColor:COLORS.panel,overflow:'hidden',marginBottom:20}}>{stages.map(([label,copy,icon],index)=><OpportunityStageRow key={label} label={label} copy={copy} icon={icon} count={label==='Reviewing'&&preview?1:0} last={index===stages.length-1}/>)}</View>:<ScrollView horizontal showsHorizontalScrollIndicator={false} contentContainerStyle={styles.pipeline}>{stages.map(([label])=><PipelineColumn key={label} label={label} count={label==='Reviewing'&&preview?1:0}/>)}</ScrollView>}
    <PanelHeader eyebrow="UPCOMING DEADLINES" title={preview?.applicationDeadline?'1 deadline found':'No deadlines yet'}/><View style={styles.panelCard}>{preview?.applicationDeadline?<EmptyInline icon="calendar" title={preview.applicationDeadline} copy={`${preview.title || 'Opportunity'} application deadline`}/>:<EmptyInline icon="calendar" title="Nothing scheduled" copy="Application deadlines, booth payments and follow-up dates will appear here once opportunities are saved."/>}</View>
  </View>
}
'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Commit targeted patch
        shell: bash
        run: |
          git config user.name "go-melanated-build"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/patch-opportunities-importer.yml
          git add apps/mobile/app/management/index.tsx
          git commit -m "Wire opportunity extraction into management importer"
          git push origin HEAD:fix/opportunities-mobile-redesign
