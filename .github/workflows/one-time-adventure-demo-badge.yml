name: One-time Adventure demo badge

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-adventure-demo-badge.yml'

permissions:
  contents: write

concurrency:
  group: adventure-ui-one-time
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply demo badge patch
        run: python scripts/patch_adventure_demo_badge.py

      - name: Fix strict indexed icon lookup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("apps/mobile/app/(tabs)/explore.tsx")
          text = p.read_text()
          text = text.replace("{categoryIcons[item]}", "{categoryIcons[item] ?? ''}")
          p.write_text(text)
          PY

      - name: Verify mobile TypeScript
        run: npm run mobile:typecheck

      - name: Commit demo badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-adventure-demo-badge.yml scripts/patch_adventure_demo_badge.py
          git add apps/mobile/app/'(tabs)'/explore.tsx
          git commit -m "fix: show demo badge on adventure cards"
          git push origin HEAD:main
