name: EAS Stamp Redesign Preview

on:
  push:
    branches:
      - stamp-redesign-device-preview
    paths:
      - 'apps/mobile/src/passport/**'
      - 'apps/mobile/app/(tabs)/passport.tsx'
      - 'apps/mobile/tsconfig.json'
      - '.github/workflows/eas-stamp-redesign-preview.yml'
  workflow_dispatch:

concurrency:
  group: eas-stamp-redesign-device-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: stamp-redesign-device-preview
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate mobile app
        run: |
          npm run mobile:lint
          npm run mobile:typecheck
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

      - name: Verify Expo authentication
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "EXPO_TOKEN repository secret is required."
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish stamp redesign OTA preview
        working-directory: apps/mobile
        run: npx eas-cli@latest update --channel preview --platform android --message "stamp-redesign:${GITHUB_SHA::8}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_APP_ENV: preview
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_SUPABASE_URL: https://hqndxityqrdiiwqyjagu.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wO8rsulmxmOlZCve3z-DIw_wkJrXn4K
