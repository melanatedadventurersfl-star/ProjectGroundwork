name: Restore current Outpost once

on:
  push:
    paths:
      - '.github/workflows/restore-outpost-known-good-once.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore current Outpost screen
        run: |
          git show 47c1670fba607a8528afcb75c745cd6d3f42bd63:'apps/mobile/src/community/OutpostScreen.tsx' > apps/mobile/src/community/OutpostScreen.tsx
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/src/community/OutpostScreen.tsx')
          text = path.read_text()
          text = text.replace(
              "function initials(name: string) {\n  return name.split(/\\s+/).filter(Boolean).slice(0, 2).map((part) => part[0]?.toUpperCase()).join('') || 'MA';\n}",
              "function initials(name?: string | null) {\n  return (name ?? '').split(/\\s+/).filter(Boolean).slice(0, 2).map((part) => part[0]?.toUpperCase()).join('') || 'MA';\n}"
          )
          path.write_text(text)
          PY

      - name: Assert native video player is not imported by Outpost
        run: |
          if grep -q "CommunityVideoPlayer\|expo-video" apps/mobile/src/community/OutpostScreen.tsx; then
            echo "Outpost still references the native video player"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify typecheck
        run: |
          npm ci
          npm run mobile:typecheck
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

      - name: Commit restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/community/OutpostScreen.tsx
          git commit -m "Restore current Outpost experience" || exit 0
          git push

# 2026-08-24: legacy restore target replaced with the latest full Outpost experience before white-screen recovery work.
