name: Repair inline community video

on:
  push:
    branches:
      - fix/inline-video-main-clean
    paths:
      - .github/workflows/fix-inline-video-main.yml

permissions:
  contents: write

jobs:
  repair-inline-video:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/inline-video-main-clean
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Wire inline player into Community posts
        run: |
          python - <<'PY'
          from pathlib import Path

          outpost = Path('apps/mobile/src/community/OutpostScreen.tsx')
          text = outpost.read_text()
          text = text.replace(
              "import { ActivityIndicator, Image, Linking, Pressable, RefreshControl, ScrollView, StyleSheet, Text, TextInput, View } from 'react-native';",
              "import { ActivityIndicator, Image, Pressable, RefreshControl, ScrollView, StyleSheet, Text, TextInput, View } from 'react-native';",
          )
          if "import { CommunityVideoPlayer } from './CommunityVideoPlayer';" not in text:
              text = text.replace(
                  "import { PostEngagementBar } from './PostEngagementBar';",
                  "import { CommunityVideoPlayer } from './CommunityVideoPlayer';\nimport { PostEngagementBar } from './PostEngagementBar';",
              )
          text = text.replace(
              "\nfunction metadataNumber(metadata: Record<string, unknown>, key: string) {\n  const value = metadata[key];\n  return typeof value === 'number' ? value : null;\n}\n",
              "\n",
          )
          text = text.replace(
              "  const videoDuration = formatDuration(metadataNumber(post.metadata, 'media_duration_ms'));\n",
              "",
          )
          old = '''      {post.media_type === 'video' && post.media_url ? (\n        <Pressable\n          style={styles.postVideo}\n          accessibilityRole="button"\n          accessibilityLabel="Play video"\n          onPress={(event) => {\n            event.stopPropagation();\n            void Linking.openURL(post.media_url!);\n          }}\n        >\n          <View style={styles.postVideoPlay}><Ionicons name="play" size={30} color="#101510" /></View>\n          <Text style={styles.postVideoTitle}>Play video</Text>\n          <Text style={styles.postVideoMeta}>{videoDuration ? `${videoDuration} · ` : ''}Opens in your device player</Text>\n        </Pressable>\n      ) : post.image_url ? <Image source={{ uri: post.image_url }} style={styles.postImage} resizeMode="cover" /> : null}'''
          new = '''      {post.media_type === 'video' && post.media_url ? (\n        <CommunityVideoPlayer uri={post.media_url} />\n      ) : post.image_url ? <Image source={{ uri: post.image_url }} style={styles.postImage} resizeMode="cover" /> : null}'''
          if old not in text:
              raise SystemExit('Outpost video block did not match expected source')
          outpost.write_text(text.replace(old, new))

          thread = Path('apps/mobile/app/community/[id].tsx')
          text = thread.read_text()
          text = text.replace(
              "import { ActivityIndicator, FlatList, Image, KeyboardAvoidingView, Linking, Modal, Platform, Pressable, StyleSheet, Text, TextInput, View } from 'react-native';",
              "import { ActivityIndicator, FlatList, Image, KeyboardAvoidingView, Modal, Platform, Pressable, StyleSheet, Text, TextInput, View } from 'react-native';",
          )
          if "import { CommunityVideoPlayer } from '../../src/community/CommunityVideoPlayer';" not in text:
              text = text.replace(
                  "import { PostEngagementBar } from '../../src/community/PostEngagementBar';",
                  "import { CommunityVideoPlayer } from '../../src/community/CommunityVideoPlayer';\nimport { PostEngagementBar } from '../../src/community/PostEngagementBar';",
              )
          helper = '''\nfunction videoDuration(post: CommunityPost) {\n  const value = post.metadata?.media_duration_ms;\n  if (typeof value !== 'number') return null;\n  const totalSeconds = Math.max(0, Math.round(value / 1000));\n  const minutes = Math.floor(totalSeconds / 60);\n  const seconds = totalSeconds % 60;\n  return `${minutes}:${String(seconds).padStart(2, '0')}`;\n}\n'''
          text = text.replace(helper, '\n')
          old = '''                  {post.media_type === 'video' && post.media_url ? (\n                    <Pressable style={styles.postVideo} onPress={() => void Linking.openURL(post.media_url!)} accessibilityRole="button" accessibilityLabel="Play video">\n                      <View style={styles.postVideoPlay}><Ionicons name="play" size={30} color="#101510" /></View>\n                      <Text style={styles.postVideoTitle}>Play video</Text>\n                      <Text style={styles.postVideoMeta}>{videoDuration(post) ? `${videoDuration(post)} · ` : ''}Opens in your device player</Text>\n                    </Pressable>\n                  ) : post.image_url ? <Image source={{ uri: post.image_url }} style={styles.postImage} resizeMode="cover" /> : null}'''
          new = '''                  {post.media_type === 'video' && post.media_url ? (\n                    <CommunityVideoPlayer uri={post.media_url} aspectRatio={4 / 3} />\n                  ) : post.image_url ? <Image source={{ uri: post.image_url }} style={styles.postImage} resizeMode="cover" /> : null}'''
          if old not in text:
              raise SystemExit('Thread video block did not match expected source')
          thread.write_text(text.replace(old, new))

          Path('apps/mobile/src/community/CommunityVideoOverlayProvider.tsx').unlink(missing_ok=True)
          PY

      - name: Refresh lockfile
        run: npm install --package-lock-only --workspace @ma/mobile

      - name: Verify clean install
        run: npm ci

      - name: Validate mobile app
        run: npm run verify:mobile

      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/community/OutpostScreen.tsx apps/mobile/app/community/'[id].tsx apps/mobile/src/community/CommunityVideoPlayer.tsx apps/mobile/package.json package-lock.json
          git add -u apps/mobile/src/community/CommunityVideoOverlayProvider.tsx || true
          git restore .
          git clean -fd
          git rm .github/workflows/fix-inline-video-main.yml
          git commit -m "fix: complete inline community video playback"
          git push origin HEAD:fix/inline-video-main-clean
