name: Fix typecheck once

on:
  push:
    paths:
      - '.github/workflows/fix-typecheck-once.yml'

permissions:
  contents: write

jobs:
  fix-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch strict TypeScript guards
        run: |
          node -e "const fs=require('fs');const p='apps/mobile/app/admin/violations.tsx';let s=fs.readFileSync(p,'utf8');const a='      nextCases.push({ profile, history: items, activeWarnings, current, latest: items[0] });';const b='      const latest = items[0];\n      if (!latest) return;\n      nextCases.push({ profile, history: items, activeWarnings, current, latest });';if(!s.includes(a))throw new Error('violations target not found');fs.writeFileSync(p,s.replace(a,b));"
          node -e "const fs=require('fs');const p='apps/mobile/app/passport/photos/[adventureId].tsx';let s=fs.readFileSync(p,'utf8');const a='    const next = (selectedIndex + direction + photos.length) % photos.length;\n    setSelectedId(photos[next].id);';const b='    const next = (selectedIndex + direction + photos.length) % photos.length;\n    const nextPhoto = photos[next];\n    if (!nextPhoto) return;\n    setSelectedId(nextPhoto.id);';if(!s.includes(a))throw new Error('gallery target not found');fs.writeFileSync(p,s.replace(a,b));"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify typecheck
        run: |
          npm ci
          npm run mobile:typecheck
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/app/admin/violations.tsx 'apps/mobile/app/passport/photos/[adventureId].tsx'
          git commit -m "fix: satisfy strict typecheck guards"
          git push
