name: Apply Outpost post interest patches

on:
  push:
    branches:
      - feature/outpost-community-model

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[outpost-tags]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/outpost-community-model
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new))

          api = 'apps/mobile/src/community/api.ts'
          replace(api, "export async function createPost(input: CreateCommunityPostInput): Promise<void>;\nexport async function createPost(body: string, adventureId?: string, groupId?: string): Promise<void>;", "export async function createPost(input: CreateCommunityPostInput): Promise<string>;\nexport async function createPost(body: string, adventureId?: string, groupId?: string): Promise<string>;")
          replace(
              api,
              "  const { error } = await supabase.from('community_posts').insert({\n    author_id: userId,\n    body,\n    post_type: input.postType ?? 'update',\n    audience,\n    adventure_id: input.adventureId ?? null,\n    group_id: audience === 'group' ? input.groupId ?? null : null,\n    circle_id: audience === 'circle' ? input.circleId ?? null : null,\n    image_url: input.imagePath ?? null,\n    metadata: input.metadata ?? {},\n  });\n  if (error) throw error;",
              "  const { data, error } = await supabase.from('community_posts').insert({\n    author_id: userId,\n    body,\n    post_type: input.postType ?? 'update',\n    audience,\n    adventure_id: input.adventureId ?? null,\n    group_id: audience === 'group' ? input.groupId ?? null : null,\n    circle_id: audience === 'circle' ? input.circleId ?? null : null,\n    image_url: input.imagePath ?? null,\n    metadata: input.metadata ?? {},\n  }).select('id').single();\n  if (error) throw error;\n  return data.id as string;",
          )

          composer = 'apps/mobile/app/community/create-in-community.tsx'
          replace(
              composer,
              "import { isPeopleCommunity } from '../../src/community/communityModel';",
              "import { setCommunityPostInterests } from '../../src/community/communityInterests';\nimport { DEFAULT_OUTDOOR_INTERESTS, isPeopleCommunity } from '../../src/community/communityModel';",
          )
          replace(
              composer,
              "  const [mode, setMode] = useState<PostMode>('update');\n  const [body, setBody] = useState('');",
              "  const [mode, setMode] = useState<PostMode>('update');\n  const [interestTags, setInterestTags] = useState<string[]>([]);\n  const [body, setBody] = useState('');",
          )
          replace(
              composer,
              "  const cannotSubmit = submitting || !selectedGroup || (!body.trim() && !photo);\n\n  async function submit() {",
              "  const cannotSubmit = submitting || !selectedGroup || (!body.trim() && !photo);\n\n  function toggleInterest(label: string) {\n    setInterestTags((current) => current.includes(label) ? current.filter((item) => item !== label) : [...current, label]);\n  }\n\n  async function submit() {",
          )
          replace(
              composer,
              "      await createPost({\n        body,\n        postType: mode,\n        audience: 'group',\n        circleId: null,\n        groupId: selectedGroup.id,\n        adventureId: selectedGroup.adventure_id ?? null,\n        imagePath: uploadedPath,\n        metadata: photo ? { media_type: 'image' } : {},\n      });\n\n      router.back();",
              "      const postId = await createPost({\n        body,\n        postType: mode,\n        audience: 'group',\n        circleId: null,\n        groupId: selectedGroup.id,\n        adventureId: selectedGroup.adventure_id ?? null,\n        imagePath: uploadedPath,\n        metadata: { ...(photo ? { media_type: 'image' } : {}), interest_labels: interestTags },\n      });\n      if (interestTags.length) await setCommunityPostInterests(postId, interestTags);\n\n      router.back();",
          )
          marker = "          <View style={styles.composerCard}>"
          insert = """          <View>\n            <Text style={styles.sectionLabel}>TOPICS</Text>\n            <Text style={styles.sectionHelper}>Optional. Choose everything this post is about.</Text>\n            <ScrollView horizontal showsHorizontalScrollIndicator={false} contentContainerStyle={{ gap: 8, paddingTop: 9, paddingRight: 12 }}>\n              {DEFAULT_OUTDOOR_INTERESTS.map((label) => {\n                const selected = interestTags.includes(label);\n                return <Pressable key={label} onPress={() => toggleInterest(label)} style={[styles.modeChip, selected && styles.modeChipSelected]}><Text style={[styles.modeText, selected && styles.modeTextSelected]}>{label}</Text></Pressable>;\n              })}\n            </ScrollView>\n          </View>\n\n""" + marker
          replace(composer, marker, insert)
          PY
      - name: Commit patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/community/api.ts apps/mobile/app/community/create-in-community.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[outpost-tags] add multi-interest community posts"
          git push origin HEAD:feature/outpost-community-model
