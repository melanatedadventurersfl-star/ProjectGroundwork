name: One-time demo adventure badges

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-demo-adventure-badges.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark seeded adventures as demos in UI
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected snippet not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          types = 'apps/mobile/src/adventures/types.ts'
          api = 'apps/mobile/src/adventures/api.ts'
          explore = 'apps/mobile/app/(tabs)/explore.tsx'
          detail = 'apps/mobile/app/adventures/[id].tsx'

          replace_exact(types, '  is_featured: boolean;\n  is_saved?: boolean;', '  is_featured: boolean;\n  is_demo?: boolean;\n  is_saved?: boolean;')

          replace_exact(
              api,
              "const DEFAULT_ADVENTURE_IMAGE_URL = Image.resolveAssetSource(\n  require('../../assets/explore/default-event.jpg'),\n).uri;\n\nfunction withAdventureImage<T extends AdventureSummary>(adventure: T): T {\n  return {\n    ...adventure,\n    hero_image_url: adventure.hero_image_url || DEFAULT_ADVENTURE_IMAGE_URL,\n  };\n}",
              "const DEFAULT_ADVENTURE_IMAGE_URL = Image.resolveAssetSource(\n  require('../../assets/explore/default-event.jpg'),\n).uri;\n\nconst DEMO_ADVENTURE_SLUGS = new Set([\n  'jax-riverside-sunset-walk-2026',\n  'jax-hanna-park-paddle-2026',\n  'jax-baldwin-trail-ride-2026',\n  'jax-huguenot-beach-campout-2026',\n  'jax-timucuan-history-hike-2026',\n  'jax-fishing-social-2026',\n]);\n\nfunction withAdventureImage<T extends AdventureSummary>(adventure: T): T {\n  return {\n    ...adventure,\n    is_demo: Boolean(adventure.is_demo || DEMO_ADVENTURE_SLUGS.has(adventure.slug)),\n    hero_image_url: adventure.hero_image_url || DEFAULT_ADVENTURE_IMAGE_URL,\n  };\n}"
          )

          replace_exact(explore, "      <View style={s.tileCopy}>\n        <Text style={s.tileTitle} numberOfLines={wide ? 2 : 1}>{adventure.title}</Text>", "      <View style={s.tileCopy}>\n        {adventure.is_demo ? <Text style={s.adventureDemoBadge}>DEMO</Text> : null}\n        <Text style={s.tileTitle} numberOfLines={wide ? 2 : 1}>{adventure.title}</Text>")
          replace_exact(explore, "        <Text style={s.featureHeroEyebrow}>FEATURED ADVENTURE</Text>", "        <Text style={s.featureHeroEyebrow}>{adventure.is_demo ? 'DEMO · FEATURED ADVENTURE' : 'FEATURED ADVENTURE'}</Text>")
          replace_exact(explore, "  tileCopy: { padding: 11 },\n  tileTitle:", "  tileCopy: { padding: 11 },\n  adventureDemoBadge: { alignSelf: 'flex-start', color: '#111816', backgroundColor: '#F5C542', borderRadius: 999, paddingHorizontal: 7, paddingVertical: 3, fontSize: 8, fontWeight: '900', letterSpacing: .7, marginBottom: 5 },\n  tileTitle:")
          replace_exact(detail, "              <Text style={styles.eyebrow}>{adventure.is_featured ? 'FEATURED ADVENTURE' : 'OFFICIAL MA ADVENTURE'}</Text>", "              <Text style={styles.eyebrow}>{adventure.is_demo ? 'DEMO ADVENTURE' : adventure.is_featured ? 'FEATURED ADVENTURE' : 'OFFICIAL MA ADVENTURE'}</Text>")
          PY

      - name: Verify mobile TypeScript
        run: npm run mobile:typecheck

      - name: Commit demo badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-demo-adventure-badges.yml
          git add apps/mobile/src/adventures/types.ts apps/mobile/src/adventures/api.ts apps/mobile/app/'(tabs)'/explore.tsx apps/mobile/app/adventures/'[id]'.tsx
          git commit -m "feat: label seeded adventures as demos"
          git push origin HEAD:main

# trigger
