name: Apply Outpost active card fix

on:
  push:
    branches:
      - fix/outpost-active-card-restore-sizing
    paths:
      - .github/workflows/apply-outpost-active-card-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/outpost-active-card-restore-sizing
      - name: Apply targeted carousel edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/src/community/FeaturedCampfireCarousel.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "const IMAGE_CARD_HEIGHT = 340;\nconst PHOTO_STAGE_HEIGHT = 214;\nconst TEXT_CARD_HEIGHT = 226;",
              "const IMAGE_CARD_HEIGHT = 316;\nconst PHOTO_STAGE_HEIGHT = 198;\nconst TEXT_CARD_HEIGHT = 216;",
          )

          replace_once(
              "  const latestScrollOffsetRef = useRef(0);\n\n  const cardWidth = Math.min(350, Math.max(248, viewportWidth * 0.84));",
              "  const latestScrollOffsetRef = useRef(0);\n  const carouselRef = useRef<ScrollView>(null);\n\n  const cardWidth = Math.min(332, Math.max(244, viewportWidth * 0.82));",
          )

          replace_once(
              "  const undoDismiss = useCallback(() => {\n    if (!undoItem) return;\n    restoreDismissedItem(undoItem.key);\n  }, [restoreDismissedItem, undoItem]);\n\n  const resetVerticalSwipe = useCallback(() => {",
              "  const undoDismiss = useCallback(() => {\n    if (!undoItem) return;\n    restoreDismissedItem(undoItem.key);\n  }, [restoreDismissedItem, undoItem]);\n\n  useEffect(() => {\n    if (!deckReady || !items.length) return;\n    const targetX = safeIndex * snapInterval;\n    requestAnimationFrame(() => {\n      carouselRef.current?.scrollTo({ x: targetX, y: 0, animated: false });\n      latestScrollOffsetRef.current = targetX;\n    });\n  }, [deckReady, items.length, safeIndex, signature, snapInterval]);\n\n  const resetVerticalSwipe = useCallback(() => {",
          )

          old_restore = """  const restoreLatestWithAnimation = useCallback(() => {\n    if (!latestDismissed) {\n      resetVerticalSwipe();\n      return;\n    }\n\n    Animated.timing(verticalSwipeY, {\n      toValue: 86,\n      duration: 110,\n      useNativeDriver: true,\n    }).start(() => {\n      const restored = restoreDismissedItem(latestDismissed.item.key);\n      if (!restored) {\n        verticalSwipeY.setValue(0);\n        return;\n      }\n      verticalSwipeY.setValue(-82);\n      Animated.spring(verticalSwipeY, {\n        toValue: 0,\n        tension: 145,\n        friction: 15,\n        useNativeDriver: true,\n      }).start();\n    });\n  }, [latestDismissed, resetVerticalSwipe, restoreDismissedItem, verticalSwipeY]);"""
          new_restore = """  const restoreLatestWithAnimation = useCallback(() => {\n    if (!latestDismissed) {\n      resetVerticalSwipe();\n      return;\n    }\n\n    verticalSwipeY.setValue(0);\n    const restored = restoreDismissedItem(latestDismissed.item.key);\n    if (!restored) return;\n\n    requestAnimationFrame(() => {\n      verticalSwipeY.setValue(-72);\n      requestAnimationFrame(() => {\n        Animated.spring(verticalSwipeY, {\n          toValue: 0,\n          tension: 145,\n          friction: 15,\n          useNativeDriver: true,\n        }).start();\n      });\n    });\n  }, [latestDismissed, resetVerticalSwipe, restoreDismissedItem, verticalSwipeY]);"""
          replace_once(old_restore, new_restore)

          replace_once(
              "        style={[styles.animatedRail, WEB_VERTICAL_GESTURE_STYLE, { transform: [{ translateY: verticalSwipeY }], opacity: animatedRailOpacity }]}\n      >\n        <ScrollView",
              "        style={[styles.animatedRail, WEB_VERTICAL_GESTURE_STYLE]}\n      >\n        <ScrollView\n          ref={carouselRef}",
          )

          old_item = """          {items.map((item, index) => (\n            <View key={item.key} style={[styles.railItem, { width: cardWidth, marginRight: index === items.length - 1 ? 0 : CARD_GAP }]}>\n              {item.kind === 'outing' ? (\n                <OutingCard event={item.event} width={cardWidth} onDismiss={() => dismissItem(item, index)} />\n              ) : (\n                <FeaturedPostCard\n                  post={item.post}\n                  group={item.post.group_id ? groups.get(item.post.group_id) : undefined}\n                  event={eventByPost.get(item.post.id)}\n                  width={cardWidth}\n                  myReaction={myReactions.get(item.post.id) ?? null}\n                  reactionCount={reactionCounts.get(item.post.id) ?? item.post.reaction_count ?? 0}\n                  reacting={reactingPostId === item.post.id}\n                  onToggleReaction={toggleReaction}\n                  onDismiss={() => dismissItem(item, index)}\n                />\n              )}\n            </View>\n          ))}"""
          new_item = """          {items.map((item, index) => (\n            <Animated.View\n              key={item.key}\n              style={[\n                styles.railItem,\n                { width: cardWidth, marginRight: index === items.length - 1 ? 0 : CARD_GAP },\n                index === safeDisplayIndex ? { transform: [{ translateY: verticalSwipeY }], opacity: animatedRailOpacity } : null,\n              ]}\n            >\n              {item.kind === 'outing' ? (\n                <OutingCard event={item.event} width={cardWidth} onDismiss={() => dismissItem(item, index)} />\n              ) : (\n                <FeaturedPostCard\n                  post={item.post}\n                  group={item.post.group_id ? groups.get(item.post.group_id) : undefined}\n                  event={eventByPost.get(item.post.id)}\n                  width={cardWidth}\n                  myReaction={myReactions.get(item.post.id) ?? null}\n                  reactionCount={reactionCounts.get(item.post.id) ?? item.post.reaction_count ?? 0}\n                  reacting={reactingPostId === item.post.id}\n                  onToggleReaction={toggleReaction}\n                  onDismiss={() => dismissItem(item, index)}\n                />\n              )}\n            </Animated.View>\n          ))}"""
          replace_once(old_item, new_item)

          path.write_text(text)
          PY
      - name: Commit targeted change
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/community/FeaturedCampfireCarousel.tsx
          git commit -m "Refine Outpost restore focus and active-card swipe"
          git push origin HEAD:fix/outpost-active-card-restore-sizing
