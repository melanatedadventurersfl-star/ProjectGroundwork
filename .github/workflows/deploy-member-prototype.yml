name: Deploy Go Melanated Web

on:
  push:
    branches:
      - main
      - feature/workout-mvp
    paths:
      - 'apps/member-app-prototype/**'
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-member-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_APP_ENV: web
      EXPO_PUBLIC_SUPABASE_URL: https://hqndxityqrdiiwqyjagu.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wO8rsulmxmOlZCve3z-DIw_wkJrXn4K
      EXPO_PUBLIC_WEB_BASE_URL: /ProjectGroundwork/app
      EXPO_PUBLIC_BUILD_SOURCE: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate standalone workout scripts
        run: |
          node --check apps/member-app-prototype/workout/catalog.js
          node --check apps/member-app-prototype/workout/app.js

      - name: Install application dependencies
        run: npm ci

      - name: Align browser React runtime
        run: |
          npm pkg set overrides.react=19.2.8
          npm install --workspace @ma/mobile --no-save react@19.2.8 react-dom@19.2.8 react-native-web@0.21.0

      - name: Export Go Melanated web app
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir dist-web --clear

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site/app
          cp -R apps/member-app-prototype/. _site/
          cp -R apps/mobile/dist-web/. _site/app/
          cp apps/mobile/dist-web/index.html _site/404.html
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          build = os.environ['GITHUB_SHA']
          short = build[:8]
          workout = Path('_site/workout')
          source_html = (workout / 'index.html').read_text(encoding='utf-8')
          source_html = source_html.replace('__WORKOUT_BUILD__', short)

          fingerprints = {}
          for asset in ('styles.css', 'catalog.js', 'app.js'):
              src = workout / asset
              stem, suffix = src.stem, src.suffix
              fingerprinted = f'{stem}.{build}{suffix}'
              shutil.copy2(src, workout / fingerprinted)
              fingerprints[asset] = fingerprinted

          root_html = source_html
          for asset, fingerprinted in fingerprints.items():
              root_html = root_html.replace(f'./{asset}', f'./{fingerprinted}')
          (workout / 'index.html').write_text(root_html, encoding='utf-8')

          release = workout / 'releases' / build
          release.mkdir(parents=True, exist_ok=True)
          release_html = source_html
          for asset in ('styles.css', 'catalog.js', 'app.js'):
              shutil.copy2(workout / asset, release / asset)
          (release / 'index.html').write_text(release_html, encoding='utf-8')

          print(f'Workout build {build}: fingerprinted root assets + unique release path')
          PY
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
