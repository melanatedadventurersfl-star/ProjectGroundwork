name: Apply Outpost card size fix

on:
  push:
    branches:
      - fix/outpost-smaller-cards
    paths:
      - .github/workflows/apply-outpost-card-size-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/outpost-smaller-cards
      - name: Reduce featured card footprint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/src/community/FeaturedCampfireCarousel.tsx')
          text = path.read_text()
          replacements = {
              "const IMAGE_CARD_HEIGHT = 316;": "const IMAGE_CARD_HEIGHT = 280;",
              "const PHOTO_STAGE_HEIGHT = 198;": "const PHOTO_STAGE_HEIGHT = 170;",
              "const TEXT_CARD_HEIGHT = 216;": "const TEXT_CARD_HEIGHT = 194;",
              "const cardWidth = Math.min(332, Math.max(244, viewportWidth * 0.82));": "const cardWidth = Math.min(304, Math.max(224, viewportWidth * 0.76));",
          }

          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one match for {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/community/FeaturedCampfireCarousel.tsx
          git commit -m "Reduce Outpost featured card footprint"
          git push origin HEAD:fix/outpost-smaller-cards
