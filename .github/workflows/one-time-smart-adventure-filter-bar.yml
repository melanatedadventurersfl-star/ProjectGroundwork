name: One-time smart Adventure filter bar

on:
  push:
    branches:
      - main
    paths:
      - 'apply_smart_filter_bar.py'
      - '.github/workflows/one-time-smart-adventure-filter-bar.yml'

permissions:
  contents: write

concurrency:
  group: adventure-ui-one-time
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply smart filter bar
        run: python apply_smart_filter_bar.py

      - name: Verify mobile TypeScript
        run: npm run mobile:typecheck

      - name: Commit smart filter bar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-smart-adventure-filter-bar.yml apply_smart_filter_bar.py
          git add apps/mobile/app/'(tabs)'/explore.tsx
          git commit -m "feat: build compact smart filter bar for Adventures"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

# retry after strict-index and push-race fixes
