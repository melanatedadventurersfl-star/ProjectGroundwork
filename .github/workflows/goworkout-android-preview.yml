name: GO Workout Android Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/app.config.js'
      - 'apps/mobile/plugins/with-goworkout-health-connect.js'
      - 'apps/mobile/workout-app/**'
      - 'apps/mobile/src/workout-app/**'
      - 'apps/member-app-prototype/workout/health-connect.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/goworkout-android-preview.yml'

permissions:
  contents: read

jobs:
  build-preview:
    name: Build GO Workout APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_APP_FLAVOR: workout
      EXPO_PUBLIC_WORKOUT_WEB_URL: https://melanatedadventurersfl-star.github.io/ProjectGroundwork/goworkout/
      EXPO_PUBLIC_APP_ENV: preview
      EXPO_PUBLIC_BUILD_SOURCE: github-actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install exact dependencies
        run: npm ci

      - name: Type-check mobile workspace
        run: npm run mobile:typecheck
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

      - name: Install GO Workout DOM runtime
        run: npm install --workspace @ma/mobile --no-save react-dom@19.2.3 react-native-web@0.21.0

      - name: Generate standalone GO Workout Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Tune Gradle for preview APK
        working-directory: apps/mobile/android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('gradle.properties')
          text = path.read_text(encoding='utf-8')
          properties = {
              'org.gradle.jvmargs': '-Xmx4096m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8',
              'org.gradle.workers.max': '2',
              'org.gradle.parallel': 'false',
              'reactNativeArchitectures': 'arm64-v8a',
              'kotlin.daemon.jvmargs': '-Xmx1536m -XX:MaxMetaspaceSize=768m',
          }

          lines = []
          for line in text.splitlines():
              if any(line.startswith(key + '=') for key in properties):
                  continue
              lines.append(line)

          lines.extend(f'{key}={value}' for key, value in properties.items())
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Verify standalone identity and Health Connect
        working-directory: apps/mobile
        run: |
          grep -R "com.melanatedadventurers.goworkout" android/app/build.gradle android/app/src/main/java >/dev/null
          grep -R "android.permission.health.READ_EXERCISE" android/app/src/main/AndroidManifest.xml >/dev/null
          grep -R "GoWorkoutHealthConnectModule" android/app/src/main/java >/dev/null

      - name: Build self-contained GO Workout APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a -x lintVitalAnalyzeRelease

      - name: Stage APK
        run: |
          mkdir -p /tmp/goworkout-apk
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk /tmp/goworkout-apk/GO-Workout-Android-Preview.apk

      - name: Upload GO Workout APK
        uses: actions/upload-artifact@v4
        with:
          name: GO-Workout-Android-Preview
          path: /tmp/goworkout-apk/GO-Workout-Android-Preview.apk
          if-no-files-found: error
          retention-days: 14
