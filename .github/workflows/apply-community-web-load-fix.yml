name: Apply community web load fix

on:
  push:
    branches:
      - fix/community-web-load
    paths:
      - .github/workflows/apply-community-web-load-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/community-web-load
      - name: Apply community loading fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/src/community/api.ts')
          text = path.read_text()

          marker = "function groupCityBackgroundUri(city?: string | null, state?: string | null) {"
          helper = (
              "type ImageResolver = {\n"
              "  resolveAssetSource?: (asset: unknown) => { uri?: string } | null;\n"
              "};\n\n"
              "function resolveAssetUri(source: unknown) {\n"
              "  if (!source) return null;\n"
              "  if (typeof source === 'string') return source;\n"
              "  if (typeof source === 'object' && 'uri' in source) {\n"
              "    const uri = (source as { uri?: unknown }).uri;\n"
              "    if (typeof uri === 'string') return uri;\n"
              "  }\n\n"
              "  const resolver = (Image as unknown as ImageResolver).resolveAssetSource;\n"
              "  if (typeof resolver !== 'function') return null;\n\n"
              "  try {\n"
              "    return resolver(source)?.uri ?? null;\n"
              "  } catch {\n"
              "    return null;\n"
              "  }\n"
              "}\n"
          )
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one city background helper marker, found {text.count(marker)}')
          text = text.replace(marker, helper + "\n" + marker, 1)

          old_resolve = "  return source ? Image.resolveAssetSource(source)?.uri ?? null : null;"
          if text.count(old_resolve) != 1:
              raise SystemExit(f'Expected one direct asset resolver, found {text.count(old_resolve)}')
          text = text.replace(old_resolve, "  return resolveAssetUri(source);", 1)

          old_membership = "  if (membershipError) throw membershipError;\n  if (membersError) throw membersError;\n\n  const myGroups = new Set((memberships ?? []).map((row: any) => row.group_id as string));\n  const counts = new Map<string, number>();\n  for (const row of allMembers ?? []) {"
          new_membership = "  const membershipRows = membershipError ? [] : memberships ?? [];\n  const memberRows = membersError ? [] : allMembers ?? [];\n\n  const myGroups = new Set(membershipRows.map((row: any) => row.group_id as string));\n  const counts = new Map<string, number>();\n  for (const row of memberRows) {"
          if text.count(old_membership) != 1:
              raise SystemExit(f'Expected one membership block, found {text.count(old_membership)}')
          text = text.replace(old_membership, new_membership, 1)

          path.write_text(text)
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/community/api.ts
          git commit -m "Fix community loading on web"
          git push origin HEAD:fix/community-web-load
