name: Apply community web load fix

on:
  push:
    branches:
      - fix/community-web-load
    paths:
      - .github/workflows/apply-community-web-load-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/community-web-load
      - name: Apply community loading fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/src/community/api.ts')
          text = path.read_text()

          old_helper = '''function groupCityBackgroundUri(city?: string | null, state?: string | null) {
  if (!city || !state) return null;
  const normalizedState = normalizeLocation(state);
  if (normalizedState !== 'fl') return null;

  const cityKey = normalizeLocation(city);
  const exact = TRAIL_GUIDE_CITIES.find((item) => item.key === cityKey);
  let source = exact?.source ?? null;

  if (!source) {
    const point = pointForCity(city, state);
    const nearest = point ? getNearestTrailGuideCity(point.latitude, point.longitude) : null;
    source = nearest?.city.source ?? null;
  }

  return source ? Image.resolveAssetSource(source)?.uri ?? null : null;
}
'''

          new_helper = '''type ImageResolver = {
  resolveAssetSource?: (asset: unknown) => { uri?: string } | null;
};

function resolveAssetUri(source: unknown) {
  if (!source) return null;
  if (typeof source === 'string') return source;
  if (typeof source === 'object' && 'uri' in source) {
    const uri = (source as { uri?: unknown }).uri;
    if (typeof uri === 'string') return uri;
  }

  const resolver = (Image as unknown as ImageResolver).resolveAssetSource;
  if (typeof resolver !== 'function') return null;

  try {
    return resolver(source)?.uri ?? null;
  } catch {
    return null;
  }
}

function groupCityBackgroundUri(city?: string | null, state?: string | null) {
  try {
    if (!city || !state) return null;
    const normalizedState = normalizeLocation(state);
    if (normalizedState !== 'fl') return null;

    const cityKey = normalizeLocation(city);
    const exact = TRAIL_GUIDE_CITIES.find((item) => item.key === cityKey);
    let source = exact?.source ?? null;

    if (!source) {
      const point = pointForCity(city, state);
      const nearest = point ? getNearestTrailGuideCity(point.latitude, point.longitude) : null;
      source = nearest?.city.source ?? null;
    }

    return resolveAssetUri(source);
  } catch {
    return null;
  }
}
'''

          if text.count(old_helper) != 1:
              raise SystemExit(f'Expected one city background helper, found {text.count(old_helper)}')
          text = text.replace(old_helper, new_helper, 1)

          old_membership = '''  if (membershipError) throw membershipError;
  if (membersError) throw membersError;

  const myGroups = new Set((memberships ?? []).map((row: any) => row.group_id as string));
  const counts = new Map<string, number>();
  for (const row of allMembers ?? []) {
'''

          new_membership = '''  const membershipRows = membershipError ? [] : memberships ?? [];
  const memberRows = membersError ? [] : allMembers ?? [];

  const myGroups = new Set(membershipRows.map((row: any) => row.group_id as string));
  const counts = new Map<string, number>();
  for (const row of memberRows) {
'''

          if text.count(old_membership) != 1:
              raise SystemExit(f'Expected one membership error block, found {text.count(old_membership)}')
          text = text.replace(old_membership, new_membership, 1)

          path.write_text(text)
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/community/api.ts
          git commit -m "Fix community loading on web"
          git push origin HEAD:fix/community-web-load
