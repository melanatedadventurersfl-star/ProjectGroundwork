<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sunlit training studio with weight racks">
<defs>
  <linearGradient id="room" x1="0" y1="0" x2=".83" y2="1">
    <stop stop-color="#173225"/><stop offset=".42" stop-color="#112a20"/><stop offset="1" stop-color="#040e0c"/>
  </linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="1" y2=".8">
    <stop stop-color="#fff1b2"/><stop offset=".23" stop-color="#e0b76b"/><stop offset=".7" stop-color="#846c43"/><stop offset="1" stop-color="#263b2e"/>
  </linearGradient>
  <linearGradient id="floor" x1=".15" y1="0" x2=".7" y2="1">
    <stop stop-color="#344439"/><stop offset=".43" stop-color="#1d2d24"/><stop offset="1" stop-color="#07110e"/>
  </linearGradient>
  <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#04100b" stop-opacity=".52"/><stop offset=".27" stop-color="#04100b" stop-opacity=".11"/><stop offset=".7" stop-color="#04100b" stop-opacity=".32"/><stop offset="1" stop-color="#04100b" stop-opacity=".78"/>
  </linearGradient>
  <radialGradient id="glow"><stop stop-color="#e4b96d" stop-opacity=".42"/><stop offset="1" stop-color="#e4b96d" stop-opacity="0"/></radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#d1b170" stop-opacity=".17"/><stop offset="1" stop-color="#274332" stop-opacity=".08"/>
  </linearGradient>
  <pattern id="grain" width="88" height="94" patternUnits="userSpaceOnUse"><circle cx="9" cy="12" r="1" fill="#c5d4bc" opacity=".09"/><circle cx="37" cy="63" r="1.2" fill="#d6b178" opacity=".055"/><circle cx="79" cy="40" r=".8" fill="#b3bcae" opacity=".08"/></pattern>
</defs>
<!-- Full bleed architectural scene. Vector artwork remains crisp on high-density displays. -->
<rect width="1080" height="1920" fill="url(#room)"/>
